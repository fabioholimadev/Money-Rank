services:
  - type: web
    runtime: static
    name: money-rank-web
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run lint && npm run build
    staticPublishPath: ./dist
    # Nao publica automaticamente enquanto API/Firestore nao estiverem prontos.
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=()
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_DATA_CONNECT_ENABLED
        value: "false"
      - key: VITE_USE_DATA_CONNECT_EMULATOR
        value: "false"
      - key: VITE_USE_FUNCTIONS_EMULATOR
        value: "false"
      - key: VITE_FIREBASE_AI_ENABLED
        value: "false"
      - key: VITE_RECAPTCHA_ENTERPRISE_SITE_KEY
        sync: false
      - key: VITE_FIREBASE_APPCHECK_DEBUG
        value: "false"
      - key: VITE_FIREBASE_APPCHECK_DEBUG_TOKEN
        value: ""
