services:
  - type: web
    runtime: docker
    name: money-rank-api
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: TEACHER_EMAILS
        value: fabiooliveiral2020@gmail.com,profciensyllas@gmail.com
      - key: FIREBASE_PROJECT_ID
        value: money-rank
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        value: money-rank.firebasestorage.app
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: SQL_CONNECT_LOCATION
        value: southamerica-east1
      - key: SQL_CONNECT_SERVICE
        value: money-rank-service
      - key: SQL_CONNECT_CONNECTOR
        value: money-rank-connector
      - key: PERIOD_ID
        value: piloto-money-rank-2026-08-11
      - key: PERIOD_DATE
        value: "2026-08-11"
  - type: web
    runtime: static
    name: money-rank-web
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run lint && npm run build
    staticPublishPath: ./dist
    # Nao publica automaticamente enquanto API/Firestore nao estiverem prontos.
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), geolocation=(), microphone=()
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_DATA_CONNECT_ENABLED
        value: "false"
      - key: VITE_USE_DATA_CONNECT_EMULATOR
        value: "false"
      - key: VITE_USE_FUNCTIONS_EMULATOR
        value: "false"
      - key: VITE_FIREBASE_AI_ENABLED
        value: "false"
      - key: VITE_RECAPTCHA_ENTERPRISE_SITE_KEY
        sync: false
      - key: VITE_FIREBASE_APPCHECK_DEBUG
        value: "false"
      - key: VITE_FIREBASE_APPCHECK_DEBUG_TOKEN
        value: ""
