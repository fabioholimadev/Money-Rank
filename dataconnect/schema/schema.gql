# Papéis reconhecidos pela plataforma. A elevação para TEACHER deve ser
# feita exclusivamente por uma rotina administrativa confiável.
enum UserRole {
  STUDENT
  TEACHER
}

enum StudentClass {
  THIRD_DSA
  THIRD_DSB
}

enum ProfessionalAvatar {
  CAPI_CIENTISTA
  CAPI_PROFESSORA
  CAPI_PROGRAMADORA
  CAPI_ECONOMISTA
  CAPI_MEDICA
  CAPI_ENGENHEIRA
}

enum ProgressStatus {
  NOT_STARTED
  IN_PROGRESS
  COMPLETED
}

enum CapiCoinTransactionType {
  CONTENT_REWARD
  ACTIVITY_REWARD
  STREAK_BONUS
  PURCHASE
  ADMIN_ADJUSTMENT
  ACTIVITY_REPEAT_REWARD
  PERIOD_CLOSE_ADJUSTMENT
}

enum RewardSuppressionReason {
  NONE
  RATE_LIMIT
  DAILY_LIMIT
}

enum CompetitionPeriodStatus {
  DRAFT
  SCHEDULED
  ACTIVE
  PAUSED
  CLOSED
}

enum ActivitySessionStatus {
  OPEN
  SUBMITTED
  EXPIRED
}

enum TestRunStatus {
  ACTIVE
  ENDED
  EXPIRED
  CLEANED
}

enum TestRunAuditAction {
  ACTIVATED
  SESSION_STARTED
  SUBMITTED
  ENDED
  CLEANED
}

# Ciclo editorial usado pelo Estúdio do Professor. Uma versão publicada nunca
# volta a rascunho; uma nova versão deve ser criada para preservar auditoria.
enum EditorialStatus {
  DRAFT
  IN_REVIEW
  PUBLISHED
  ARCHIVED
}

enum EditorialEntityType {
  LEARNING_MODULE
  ACTIVITY_DEFINITION
  RESEARCH_REVIEW
}

enum ResearchReviewStatus {
  PENDING_TEACHER_REVIEW
  TEACHER_APPROVED
  REJECTED
}

enum ContentAssetType {
  VIDEO
  SLIDES
  DOCUMENT
  SUMMARY
  EXTERNAL_LINK
}

enum PedagogicalItemType {
  QUESTION
  DECISION
  PATH
  CARD
}

enum PedagogicalDifficulty {
  EASY
  MEDIUM
  HARD
}

enum PedagogicalReviewStatus {
  PILOT_UNREVIEWED
  TECHNICALLY_APPROVED
  PEDAGOGICALLY_APPROVED
  FULLY_APPROVED
}

# O uid do Firebase Auth é a chave primária. Isso elimina a necessidade de
# manter um segundo identificador e permite filtros seguros com auth.uid.
type User
  @table(
    name: "users"
    key: "uid"
    singular: "user"
    plural: "users"
  ) {
  uid: String!
    @col(name: "firebase_uid", dataType: "varchar(128)")
    @default(expr: "auth.uid")
  email: String! @col(dataType: "varchar(320)") @unique
  preferredName: String!
    @col(name: "preferred_name", dataType: "varchar(40)")
  classGroup: StudentClass @col(name: "class_group") @index
  role: UserRole! @default(value: STUDENT) @index
  avatarId: ProfessionalAvatar @col(name: "avatar_id")
  avatarUrl: String @col(name: "avatar_url", dataType: "varchar(2048)")
  profileCompleted: Boolean!
    @col(name: "profile_completed")
    @default(value: false)
  isTest: Boolean! @col(name: "is_test") @default(value: false)
  testRunId: String
    @col(name: "test_run_id", dataType: "varchar(96)")
    @index
  origin: String @col(dataType: "varchar(32)")
  capiCoins: Int! @col(name: "capi_coins") @default(value: 0)
  currentPhase: Int! @col(name: "current_phase") @default(value: 0)
  currentStreak: Int! @col(name: "current_streak") @default(value: 0)
  lastStreakDate: Date @col(name: "last_streak_date")
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
  updatedAt: Timestamp!
    @col(name: "updated_at")
    @default(expr: "request.time")
}

# Uma linha representa o estado consolidado de um aluno em uma fase. A chave
# composta impede duplicidade para a mesma combinação de aluno e fase.
type StudentProgress
  @table(
    name: "student_progress"
    key: ["user", "phaseNumber"]
    singular: "studentProgress"
    plural: "studentProgressEntries"
  )
  @index(fields: ["userUid", "updatedAt"], order: [ASC, DESC]) {
  user: User! @ref(fields: "userUid", references: "uid")
  userUid: String!
    @col(name: "user_uid", dataType: "varchar(128)")
  phaseNumber: Int! @col(name: "phase_number")
  status: ProgressStatus! @default(value: NOT_STARTED) @index
  score: Int! @default(value: 0)
  attempts: Int! @default(value: 0)
  correctAnswers: Int!
    @col(name: "correct_answers")
    @default(value: 0)
  wrongAnswers: Int!
    @col(name: "wrong_answers")
    @default(value: 0)
  startedAt: Timestamp @col(name: "started_at")
  completedAt: Timestamp @col(name: "completed_at")
  updatedAt: Timestamp!
    @col(name: "updated_at")
    @default(expr: "request.time")
}

# Cada execução de uma atividade gera uma tentativa imutável. O attemptId
# funciona como chave de idempotência para impedir recompensa duplicada em
# reenvios de rede.
type ActivityAttempt
  @table(
    name: "activity_attempts"
    singular: "activityAttempt"
    plural: "activityAttempts"
  )
  @index(
    fields: ["userUid", "phaseNumber", "createdAt"]
    order: [ASC, ASC, DESC]
  )
  @index(fields: ["createdAt", "userUid"], order: [DESC, ASC]) {
  user: User! @ref(fields: "userUid", references: "uid")
  userUid: String!
    @col(name: "user_uid", dataType: "varchar(128)")
  activityId: String!
    @col(name: "activity_id", dataType: "varchar(128)")
  activitySession: ActivitySession
    @ref(fields: "activitySessionId", references: "id")
  activitySessionId: UUID
    @col(name: "activity_session_id")
    @unique
  phaseNumber: Int! @col(name: "phase_number")
  score: Int!
  correctAnswers: Int! @col(name: "correct_answers")
  wrongAnswers: Int! @col(name: "wrong_answers")
  passed: Boolean!
  firstCompletion: Boolean! @col(name: "first_completion")
  rewardBase: Int! @col(name: "reward_base") @default(value: 0)
  streakMultiplierPercent: Int!
    @col(name: "streak_multiplier_percent")
    @default(value: 100)
  streakBonus: Int! @col(name: "streak_bonus") @default(value: 0)
  rewardAmount: Int! @col(name: "reward_amount") @default(value: 0)
  rewardLimitReached: Boolean!
    @col(name: "reward_limit_reached")
    @default(value: false)
  rewardSuppressionReason: RewardSuppressionReason!
    @col(name: "reward_suppression_reason")
    @default(value: NONE)
  isTest: Boolean! @col(name: "is_test") @default(value: false) @index
  testRunId: UUID @col(name: "test_run_id") @index
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
}

# Sessão preparada por backend confiável. O payload público pode ser
# devolvido ao aluno; answerKey nunca aparece em operações do SDK Web.
type ActivitySession
  @table(
    name: "activity_sessions"
    singular: "activitySession"
    plural: "activitySessions"
  )
  @index(fields: ["userUid", "status", "createdAt"], order: [ASC, ASC, DESC]) {
  user: User! @ref(fields: "userUid", references: "uid")
  userUid: String!
    @col(name: "user_uid", dataType: "varchar(128)")
  activityId: String!
    @col(name: "activity_id", dataType: "varchar(128)")
  phaseNumber: Int! @col(name: "phase_number")
  variantId: String @col(name: "variant_id", dataType: "varchar(128)")
  contentVersion: String!
    @col(name: "content_version", dataType: "varchar(32)")
  publicPayload: Any! @col(name: "public_payload")
  answerKey: Any! @col(name: "answer_key")
  status: ActivitySessionStatus! @default(value: OPEN) @index
  isTest: Boolean! @col(name: "is_test") @default(value: false) @index
  testRunId: UUID @col(name: "test_run_id") @index
  expiresAt: Timestamp! @col(name: "expires_at") @index
  submittedAt: Timestamp @col(name: "submitted_at")
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
  updatedAt: Timestamp!
    @col(name: "updated_at")
    @default(expr: "request.time")
}

# Versão completa de um conteúdo de fase. publicationKey é preenchida apenas
# na versão publicada e, por ser única, impede duas publicações simultâneas
# para o mesmo módulo mesmo sob concorrência.
type LearningModuleVersion
  @table(
    name: "learning_module_versions"
    singular: "learningModuleVersion"
    plural: "learningModuleVersions"
  )
  @unique(fields: ["moduleKey", "version"])
  @index(fields: ["moduleKey", "status", "version"], order: [ASC, ASC, DESC]) {
  moduleKey: String!
    @col(name: "module_key", dataType: "varchar(64)")
  phaseNumber: Int! @col(name: "phase_number")
  version: Int!
  status: EditorialStatus! @default(value: DRAFT)
  publicationKey: String
    @col(name: "publication_key", dataType: "varchar(64)")
    @unique
  title: String! @col(dataType: "varchar(140)")
  changeSummary: String!
    @col(name: "change_summary", dataType: "varchar(240)")
  payload: Any!
  createdByUid: String!
    @col(name: "created_by_uid", dataType: "varchar(128)")
  publishedByUid: String
    @col(name: "published_by_uid", dataType: "varchar(128)")
  publishedAt: Timestamp @col(name: "published_at")
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
  updatedAt: Timestamp!
    @col(name: "updated_at")
    @default(expr: "request.time")
}

# A definição editorial contém textos e regras estruturadas. O gabarito
# utilizado pelo aluno continua sendo derivado somente na Function autoritativa.
type ActivityDefinitionVersion
  @table(
    name: "activity_definition_versions"
    singular: "activityDefinitionVersion"
    plural: "activityDefinitionVersions"
  )
  @unique(fields: ["activityKey", "version"])
  @index(fields: ["activityKey", "status", "version"], order: [ASC, ASC, DESC]) {
  activityKey: String!
    @col(name: "activity_key", dataType: "varchar(96)")
  phaseNumber: Int! @col(name: "phase_number")
  version: Int!
  status: EditorialStatus! @default(value: DRAFT)
  publicationKey: String
    @col(name: "publication_key", dataType: "varchar(96)")
    @unique
  title: String! @col(dataType: "varchar(140)")
  changeSummary: String!
    @col(name: "change_summary", dataType: "varchar(240)")
  payload: Any!
  createdByUid: String!
    @col(name: "created_by_uid", dataType: "varchar(128)")
  publishedByUid: String
    @col(name: "published_by_uid", dataType: "varchar(128)")
  publishedAt: Timestamp @col(name: "published_at")
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
  updatedAt: Timestamp!
    @col(name: "updated_at")
    @default(expr: "request.time")
}

# Metadados de materiais externos ou do Firebase Storage. Nenhum binário ou
# Base64 é salvo no PostgreSQL.
type ContentAsset
  @table(
    name: "content_assets"
    singular: "contentAsset"
    plural: "contentAssets"
  )
  @index(fields: ["entityType", "entityId"], order: [ASC, ASC]) {
  entityType: EditorialEntityType! @col(name: "entity_type")
  entityId: UUID! @col(name: "entity_id")
  assetType: ContentAssetType! @col(name: "asset_type")
  displayName: String!
    @col(name: "display_name", dataType: "varchar(160)")
  url: String! @col(dataType: "varchar(2048)")
  storagePath: String
    @col(name: "storage_path", dataType: "varchar(512)")
  mimeType: String @col(name: "mime_type", dataType: "varchar(120)")
  sizeBytes: Int64 @col(name: "size_bytes")
  sha256: String @col(dataType: "varchar(64)")
  createdByUid: String!
    @col(name: "created_by_uid", dataType: "varchar(128)")
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
}

# Fila de fontes sugeridas por professor, Codex ou Gemini. A aprovação é
# pedagógica e não publica automaticamente uma atividade.
type ResearchReview
  @table(
    name: "research_reviews"
    singular: "researchReview"
    plural: "researchReviews"
  )
  @index(fields: ["status", "createdAt"], order: [ASC, DESC]) {
  activityKey: String!
    @col(name: "activity_key", dataType: "varchar(96)")
  factKey: String! @col(name: "fact_key", dataType: "varchar(96)")
  title: String! @col(dataType: "varchar(180)")
  claim: String! @col(dataType: "text")
  sourceUrl: String!
    @col(name: "source_url", dataType: "varchar(2048)")
  proposedBy: String!
    @col(name: "proposed_by", dataType: "varchar(32)")
  status: ResearchReviewStatus!
    @default(value: PENDING_TEACHER_REVIEW)
  reviewNotes: String @col(name: "review_notes", dataType: "text")
  createdByUid: String!
    @col(name: "created_by_uid", dataType: "varchar(128)")
  reviewedByUid: String
    @col(name: "reviewed_by_uid", dataType: "varchar(128)")
  reviewedAt: Timestamp @col(name: "reviewed_at")
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
  updatedAt: Timestamp!
    @col(name: "updated_at")
    @default(expr: "request.time")
}

# Log append-only das mudanças editoriais. O cliente não recebe operação
# de update ou delete para esta tabela.
type EditorialAuditLog
  @table(
    name: "editorial_audit_log"
    singular: "editorialAuditLog"
    plural: "editorialAuditLogs"
  )
  @index(fields: ["entityType", "entityId", "createdAt"], order: [ASC, ASC, DESC]) {
  entityType: EditorialEntityType! @col(name: "entity_type")
  entityId: UUID! @col(name: "entity_id")
  entityKey: String!
    @col(name: "entity_key", dataType: "varchar(96)")
  version: Int!
  action: String! @col(dataType: "varchar(32)")
  actorUid: String!
    @col(name: "actor_uid", dataType: "varchar(128)")
  summary: String! @col(dataType: "varchar(240)")
  details: Any
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
}

# Configuração única e administrativa da economia. O limite nulo significa
# que as repetições remuneradas ainda não possuem teto definido.
type EconomyConfig
  @table(
    name: "economy_config"
    key: "configKey"
    singular: "economyConfig"
    plural: "economyConfigs"
  ) {
  configKey: String!
    @col(name: "config_key", dataType: "varchar(32)")
  firstContentReward: Int!
    @col(name: "first_content_reward")
    @default(value: 20)
  firstActivityReward: Int!
    @col(name: "first_activity_reward")
    @default(value: 100)
  repeatActivityReward: Int!
    @col(name: "repeat_activity_reward")
    @default(value: 20)
  rewardedRepeatLimitPerDay: Int
    @col(name: "rewarded_repeat_limit_per_day")
  minimumRewardedAttemptIntervalSeconds: Int!
    @col(name: "minimum_rewarded_attempt_interval_seconds")
    @default(value: 30)
  streakTier3Percent: Int!
    @col(name: "streak_tier_3_percent")
    @default(value: 110)
  streakTier5Percent: Int!
    @col(name: "streak_tier_5_percent")
    @default(value: 120)
  streakTier7Percent: Int!
    @col(name: "streak_tier_7_percent")
    @default(value: 130)
  updatedAt: Timestamp!
    @col(name: "updated_at")
    @default(expr: "request.time")
}

# Janela configurável da competição. DRAFT não conta pontos; SCHEDULED conta
# automaticamente dentro do intervalo; ACTIVE conta enquanto estiver no
# intervalo; PAUSED suspende a atribuição; CLOSED preserva o resultado.
type CompetitionPeriod
  @table(
    name: "competition_periods"
    singular: "competitionPeriod"
    plural: "competitionPeriods"
  )
  @index(fields: ["status", "startsAt"], order: [ASC, ASC]) {
  name: String! @col(dataType: "varchar(80)")
  periodKey: String
    @col(name: "period_key", dataType: "varchar(96)")
    @unique
  timeZone: String!
    @col(name: "time_zone", dataType: "varchar(64)")
    @default(value: "America/Fortaleza")
  schedule: Any
  status: CompetitionPeriodStatus! @default(value: DRAFT)
  # Sentinela anulável: somente ACTIVE usa este valor. A unicidade impede
  # duas ativações concorrentes sem limitar rascunhos ou períodos históricos.
  activeSlot: String @col(name: "active_slot", dataType: "varchar(16)") @unique
  startsAt: Timestamp! @col(name: "starts_at")
  endsAt: Timestamp! @col(name: "ends_at")
  pausedAt: Timestamp @col(name: "paused_at")
  closedAt: Timestamp @col(name: "closed_at")
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
  updatedAt: Timestamp!
    @col(name: "updated_at")
    @default(expr: "request.time")
}

# Livro-caixa imutável de CapiCoins. O saldo atual fica em User.capiCoins para
# leitura rápida; cada alteração gera uma linha nesta tabela na mesma operação.
type CapiCoinTransaction
  @table(
    name: "capi_coin_transactions"
    singular: "capiCoinTransaction"
    plural: "capiCoinTransactions"
  )
  @index(fields: ["userUid", "createdAt"], order: [ASC, DESC])
  @index(fields: ["competitionPeriodId", "userUid"], order: [ASC, ASC]) {
  user: User! @ref(fields: "userUid", references: "uid")
  userUid: String!
    @col(name: "user_uid", dataType: "varchar(128)")
  attempt: ActivityAttempt @ref(fields: "attemptId", references: "id")
  attemptId: UUID @col(name: "attempt_id")
  competitionPeriod: CompetitionPeriod
    @ref(fields: "competitionPeriodId", references: "id")
  competitionPeriodId: UUID
    @col(name: "competition_period_id")
    @index
  amount: Int!
  baseAmount: Int! @col(name: "base_amount") @default(value: 0)
  streakMultiplierPercent: Int!
    @col(name: "streak_multiplier_percent")
    @default(value: 100)
  streakBonus: Int! @col(name: "streak_bonus") @default(value: 0)
  transactionType: CapiCoinTransactionType!
    @col(name: "transaction_type")
  reason: String! @col(dataType: "varchar(160)")
  sourceId: String @col(name: "source_id", dataType: "varchar(128)")
  phaseNumber: Int @col(name: "phase_number")
  classGroup: StudentClass @col(name: "class_group")
  competitionWeek: Date @col(name: "competition_week") @index
  isTest: Boolean! @col(name: "is_test") @default(value: false) @index
  testRunId: UUID @col(name: "test_run_id") @index
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
}

# Registro imutável da origem de cada carga pedagógica. O hash SHA-256 é a
# chave de idempotência e permite reconciliar o banco com a planilha original.
type PedagogicalBankLoad
  @table(
    name: "pedagogical_bank_loads"
    key: "loadHash"
    singular: "pedagogicalBankLoad"
    plural: "pedagogicalBankLoads"
  ) {
  loadHash: String!
    @col(name: "load_hash", dataType: "varchar(64)")
  loadVersion: String!
    @col(name: "load_version", dataType: "varchar(32)")
  sourceFile: String!
    @col(name: "source_file", dataType: "varchar(240)")
  itemCount: Int! @col(name: "item_count")
  insertedCount: Int! @col(name: "inserted_count") @default(value: 0)
  updatedCount: Int! @col(name: "updated_count") @default(value: 0)
  ignoredCount: Int! @col(name: "ignored_count") @default(value: 0)
  rejectedCount: Int! @col(name: "rejected_count") @default(value: 0)
  importedAt: Timestamp!
    @col(name: "imported_at")
    @default(expr: "request.time")
}

# Item normalizado da planilha. O payload público não contém respostas,
# pontuações, deltas de crédito ou feedback pós-submissão.
type PedagogicalItem
  @table(
    name: "pedagogical_items"
    key: ["activityId", "version", "itemId"]
    singular: "pedagogicalItem"
    plural: "pedagogicalItems"
  )
  @index(fields: ["activityId", "active", "difficulty"], order: [ASC, ASC, ASC])
  @index(fields: ["activityId", "characterId", "difficulty"], order: [ASC, ASC, ASC]) {
  activityId: String!
    @col(name: "activity_id", dataType: "varchar(128)")
  version: String! @col(dataType: "varchar(32)")
  itemId: String! @col(name: "item_id", dataType: "varchar(64)")
  phaseNumber: Int! @col(name: "phase_number")
  itemType: PedagogicalItemType! @col(name: "item_type")
  characterId: String
    @col(name: "character_id", dataType: "varchar(96)")
  difficulty: PedagogicalDifficulty!
  stage: Int
  pathCondition: String
    @col(name: "path_condition", dataType: "varchar(64)")
  publicPayload: Any! @col(name: "public_payload")
  secretPayload: Any! @col(name: "secret_payload")
  sourceId: String!
    @col(name: "source_id", dataType: "varchar(96)")
  sourceUrl: String!
    @col(name: "source_url", dataType: "varchar(2048)")
  tags: [String!]!
  active: Boolean! @default(value: true)
  reviewStatus: PedagogicalReviewStatus!
    @col(name: "review_status")
    @default(value: PILOT_UNREVIEWED)
  origin: String! @col(dataType: "varchar(64)")
  contentHash: String!
    @col(name: "content_hash", dataType: "varchar(64)")
  load: PedagogicalBankLoad!
    @ref(fields: "loadHash", references: "loadHash")
  loadHash: String!
    @col(name: "load_hash", dataType: "varchar(64)")
  createdAt: Timestamp!
    @col(name: "created_at")
    @default(expr: "request.time")
  updatedAt: Timestamp!
    @col(name: "updated_at")
    @default(expr: "request.time")
}

# Execução isolada criada pelo professor para validar as atividades fora de um
# período oficial. O activeSlot impede duas execuções simultâneas e o prazo
# obrigatório garante expiração no servidor.
type TestRun
  @table(
    name: "test_runs"
    singular: "testRun"
    plural: "testRuns"
  )
  @index(fields: ["createdByUid", "createdAt"], order: [ASC, DESC]) {
  createdByUid: String!
    @col(name: "created_by_uid", dataType: "varchar(128)")
  status: TestRunStatus! @default(value: ACTIVE) @index
  activeSlot: String
    @col(name: "active_slot", dataType: "varchar(16)")
    @unique
  durationMinutes: Int! @col(name: "duration_minutes")
  startsAt: Timestamp! @col(name: "starts_at")
  endsAt: Timestamp! @col(name: "ends_at") @index
  endedAt: Timestamp @col(name: "ended_at")
  cleanedAt: Timestamp @col(name: "cleaned_at")
