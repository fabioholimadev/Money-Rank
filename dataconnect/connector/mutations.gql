# Migração segura para perfis criados antes do Passo 0. Somente alunos que
# ainda não possuem nenhum progresso podem voltar de 1 para 0.
mutation InitializeMyTrail @auth(level: USER_EMAIL_VERIFIED) {
  affectedRows: _execute(
    sql: """
      UPDATE users AS u
      SET
        current_phase = 0,
        updated_at = CURRENT_TIMESTAMP
      WHERE
        u.firebase_uid = $1
        AND u.current_phase = 1
        AND NOT EXISTS (
          SELECT 1
          FROM student_progress AS sp
          WHERE sp.user_uid = u.firebase_uid
        )
    """
    params: [{ _expr: "auth.uid" }]
  )
}

# O Passo 0 é concluído uma única vez. A mesma instrução SQL registra o
# progresso, libera a Fase 1, credita a recompensa de conteúdo e cria o
# lançamento no livro-caixa.
mutation CompleteMyIntroduction @auth(level: USER_EMAIL_VERIFIED) {
  affectedRows: _execute(
    sql: """
      WITH settings AS (
        SELECT
          COALESCE((
            SELECT first_content_reward
            FROM economy_config
            WHERE config_key = 'default'
          ), 20)::integer AS base_reward,
          COALESCE((
            SELECT streak_tier_3_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 110)::integer AS tier_3,
          COALESCE((
            SELECT streak_tier_5_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 120)::integer AS tier_5,
          COALESCE((
            SELECT streak_tier_7_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 130)::integer AS tier_7
      ),
      local_clock AS (
        SELECT
          (CURRENT_TIMESTAMP AT TIME ZONE 'America/Fortaleza')::date
            AS local_date
      ),
      active_competition AS (
        SELECT period.id
        FROM competition_periods AS period
        WHERE
          period.status IN ('SCHEDULED', 'ACTIVE')
          AND period.starts_at <= CURRENT_TIMESTAMP
          AND period.ends_at > CURRENT_TIMESTAMP
        ORDER BY period.starts_at DESC
        LIMIT 1
      ),
      completed_progress AS (
        INSERT INTO student_progress (
          user_uid,
          phase_number,
          status,
          score,
          attempts,
          correct_answers,
          wrong_answers,
          started_at,
          completed_at,
          updated_at
        )
        SELECT
          u.firebase_uid,
          0,
          'COMPLETED',
          100,
          1,
          1,
          0,
          CURRENT_TIMESTAMP,
          CURRENT_TIMESTAMP,
          CURRENT_TIMESTAMP
        FROM users AS u
        WHERE
          u.firebase_uid = $1
          AND u.current_phase = 0
        ON CONFLICT (user_uid, phase_number) DO NOTHING
        RETURNING user_uid
      ),
      reward_seed AS (
        SELECT
          u.firebase_uid,
          u.class_group,
          settings.base_reward,
          settings.tier_3,
          settings.tier_5,
          settings.tier_7,
          local_clock.local_date,
          CASE
            WHEN u.last_streak_date = local_clock.local_date
              THEN GREATEST(u.current_streak, 1)
            WHEN u.last_streak_date = local_clock.local_date - 1
              THEN u.current_streak + 1
            ELSE 1
          END AS next_streak
        FROM users AS u
        INNER JOIN completed_progress AS progress
          ON progress.user_uid = u.firebase_uid
        CROSS JOIN settings
        CROSS JOIN local_clock
      ),
      reward_context AS (
        SELECT
          reward_seed.*,
          100 AS multiplier_percent
        FROM reward_seed
      ),
      reward_values AS (
        SELECT
          reward_context.*,
          FLOOR(
            base_reward * multiplier_percent / 100.0
          )::integer AS reward_amount
        FROM reward_context
      ),
      credited_user AS (
        UPDATE users AS u
        SET
          current_phase = 1,
          capi_coins = u.capi_coins + values.reward_amount,
          current_streak = values.next_streak,
          last_streak_date = values.local_date,
          updated_at = CURRENT_TIMESTAMP
        FROM reward_values AS values
        WHERE u.firebase_uid = values.firebase_uid
        RETURNING
          u.firebase_uid,
          values.class_group,
          values.base_reward,
          values.multiplier_percent,
          values.reward_amount,
          values.local_date
      )
      INSERT INTO capi_coin_transactions (
        user_uid,
        amount,
        base_amount,
        streak_multiplier_percent,
        streak_bonus,
        transaction_type,
        reason,
        source_id,
        phase_number,
        class_group,
        competition_period_id,
        competition_week,
        created_at
      )
      SELECT
        credited_user.firebase_uid,
        credited_user.reward_amount,
        credited_user.base_reward,
        credited_user.multiplier_percent,
        credited_user.reward_amount - credited_user.base_reward,
        'CONTENT_REWARD',
        'Conclusão do Passo 0',
        'introduction-0',
        0,
        credited_user.class_group,
        (SELECT id FROM active_competition),
        (
          credited_user.local_date
          - (
            EXTRACT(ISODOW FROM credited_user.local_date)::integer - 1
          )
        )::date,
        CURRENT_TIMESTAMP
      FROM credited_user
    """
    params: [{ _expr: "auth.uid" }]
  )
}

# Ao concluir o conteúdo da fase atual, cria o estado IN_PROGRESS e paga a
# recompensa de conteúdo. O INSERT com conflito ignorado garante idempotência.
mutation CompleteMyCurrentPhaseContent($phaseNumber: Int!)
  @auth(level: USER_EMAIL_VERIFIED) {
  affectedRows: _execute(
    sql: """
      WITH settings AS (
        SELECT
          COALESCE((
            SELECT first_content_reward
            FROM economy_config
            WHERE config_key = 'default'
          ), 20)::integer AS base_reward,
          COALESCE((
            SELECT streak_tier_3_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 110)::integer AS tier_3,
          COALESCE((
            SELECT streak_tier_5_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 120)::integer AS tier_5,
          COALESCE((
            SELECT streak_tier_7_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 130)::integer AS tier_7
      ),
      local_clock AS (
        SELECT
          (CURRENT_TIMESTAMP AT TIME ZONE 'America/Fortaleza')::date
            AS local_date
      ),
      active_competition AS (
        SELECT period.id
        FROM competition_periods AS period
        WHERE
          period.status IN ('SCHEDULED', 'ACTIVE')
          AND period.starts_at <= CURRENT_TIMESTAMP
          AND period.ends_at > CURRENT_TIMESTAMP
        ORDER BY period.starts_at DESC
        LIMIT 1
      ),
      started_progress AS (
        INSERT INTO student_progress (
          user_uid,
          phase_number,
          status,
          score,
          attempts,
          correct_answers,
          wrong_answers,
          started_at,
          updated_at
        )
        SELECT
          u.firebase_uid,
          $1,
          'IN_PROGRESS',
          0,
          0,
          0,
          0,
          CURRENT_TIMESTAMP,
          CURRENT_TIMESTAMP
        FROM users AS u
        WHERE
          u.firebase_uid = $2
          AND u.current_phase = $1
          AND $1 BETWEEN 1 AND 4
        ON CONFLICT (user_uid, phase_number) DO UPDATE
        SET
          status = 'IN_PROGRESS',
          started_at = COALESCE(
            student_progress.started_at,
            CURRENT_TIMESTAMP
          ),
          updated_at = CURRENT_TIMESTAMP
        WHERE student_progress.status = 'NOT_STARTED'
        RETURNING user_uid
      ),
      reward_seed AS (
        SELECT
          u.firebase_uid,
          u.class_group,
          settings.base_reward,
          settings.tier_3,
          settings.tier_5,
          settings.tier_7,
          local_clock.local_date,
          CASE
            WHEN u.last_streak_date = local_clock.local_date
              THEN GREATEST(u.current_streak, 1)
            WHEN u.last_streak_date = local_clock.local_date - 1
              THEN u.current_streak + 1
            ELSE 1
          END AS next_streak
        FROM users AS u
        INNER JOIN started_progress AS progress
          ON progress.user_uid = u.firebase_uid
        CROSS JOIN settings
        CROSS JOIN local_clock
      ),
      reward_context AS (
        SELECT
          reward_seed.*,
          100 AS multiplier_percent
        FROM reward_seed
      ),
      reward_values AS (
        SELECT
          reward_context.*,
          FLOOR(
            base_reward * multiplier_percent / 100.0
          )::integer AS reward_amount
        FROM reward_context
      ),
      credited_user AS (
        UPDATE users AS u
        SET
          capi_coins = u.capi_coins + values.reward_amount,
          current_streak = values.next_streak,
          last_streak_date = values.local_date,
          updated_at = CURRENT_TIMESTAMP
        FROM reward_values AS values
        WHERE u.firebase_uid = values.firebase_uid
        RETURNING
          u.firebase_uid,
          values.class_group,
          values.base_reward,
          values.multiplier_percent,
          values.reward_amount,
          values.local_date
      )
      INSERT INTO capi_coin_transactions (
        user_uid,
        amount,
        base_amount,
        streak_multiplier_percent,
        streak_bonus,
        transaction_type,
        reason,
        source_id,
        phase_number,
        class_group,
        competition_period_id,
        competition_week,
        created_at
      )
      SELECT
        credited_user.firebase_uid,
        credited_user.reward_amount,
        credited_user.base_reward,
        credited_user.multiplier_percent,
        credited_user.reward_amount - credited_user.base_reward,
        'CONTENT_REWARD',
        CONCAT('Conteúdo da Fase ', $1::text),
        CONCAT('phase-', $1::text, '-content'),
        $1,
        credited_user.class_group,
        (SELECT id FROM active_competition),
        (
          credited_user.local_date
          - (
            EXTRACT(ISODOW FROM credited_user.local_date)::integer - 1
          )
        )::date,
        CURRENT_TIMESTAMP
      FROM credited_user
    """
    params: [$phaseNumber, { _expr: "auth.uid" }]
  )
}

# Registra uma tentativa que ainda não alcançou a pontuação mínima. Não libera
# a próxima fase e não gera moedas.
mutation RegisterMyCurrentPhaseAttempt(
  $attemptId: UUID!
  $sessionId: UUID!
  $studentUid: String!
  $activityId: String!
  $phaseNumber: Int!
  $score: Int!
  $correctAnswers: Int!
  $wrongAnswers: Int!
)
  @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      WITH eligible_attempt AS (
        SELECT
          sp.user_uid,
          sp.phase_number
        FROM student_progress AS sp
        INNER JOIN users AS u
          ON u.firebase_uid = sp.user_uid
        WHERE
          sp.user_uid = $8
          AND sp.phase_number = $4
          AND EXISTS (
            SELECT 1
            FROM activity_sessions AS session
            WHERE
              session.id = $2::uuid
              AND session.user_uid = $8
              AND session.activity_id = $3
              AND session.phase_number = $4
              AND session.status = 'OPEN'
              AND session.expires_at > CURRENT_TIMESTAMP
          )
          AND (
            (
              sp.status = 'IN_PROGRESS'
              AND u.current_phase = $4
            )
            OR (
              sp.status = 'COMPLETED'
              AND $4 <= u.current_phase
            )
          )
          AND $4 BETWEEN 1 AND 4
          AND $5 BETWEEN 0 AND 59
          AND $6 >= 0
          AND $7 >= 0
          AND LENGTH($3) BETWEEN 1 AND 128
      ),
      created_attempt AS (
        INSERT INTO activity_attempts (
          id,
          user_uid,
          activity_id,
          activity_session_id,
          phase_number,
          score,
          correct_answers,
          wrong_answers,
          passed,
          first_completion,
          reward_base,
          streak_multiplier_percent,
          streak_bonus,
          reward_amount,
          reward_limit_reached,
          created_at
        )
        SELECT
          $1::uuid,
          eligible_attempt.user_uid,
          $3,
          $2::uuid,
          $4,
          $5,
          $6,
          $7,
          FALSE,
          FALSE,
          0,
          100,
          0,
          0,
          FALSE,
          CURRENT_TIMESTAMP
        FROM eligible_attempt
        ON CONFLICT (id) DO NOTHING
        RETURNING user_uid, phase_number
      )
      UPDATE student_progress AS sp
      SET
        score = GREATEST(sp.score, $5),
        attempts = sp.attempts + 1,
        correct_answers = GREATEST(sp.correct_answers, $6),
        wrong_answers = sp.wrong_answers + $7,
        updated_at = CURRENT_TIMESTAMP
      FROM created_attempt
      WHERE
        sp.user_uid = created_attempt.user_uid
        AND sp.phase_number = created_attempt.phase_number
    """
    params: [
      $attemptId
      $sessionId
      $activityId
      $phaseNumber
      $score
      $correctAnswers
      $wrongAnswers
      $studentUid
    ]
  )
}

# Conclusão atômica e idempotente da atividade atual. A pontuação mínima é
# validada na autorização; o SQL só aceita a fase corrente em IN_PROGRESS.
# O streak usa CURRENT_DATE do servidor:
# - mesma data: mantém o valor;
# - dia imediatamente anterior: soma um;
# - intervalo maior: reinicia em um.
mutation CompleteMyCurrentPhase(
  $attemptId: UUID!
  $sessionId: UUID!
  $studentUid: String!
  $activityId: String!
  $phaseNumber: Int!
  $score: Int!
  $correctAnswers: Int!
  $wrongAnswers: Int!
)
  @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      WITH settings AS (
        SELECT
          COALESCE((
            SELECT first_activity_reward
            FROM economy_config
            WHERE config_key = 'default'
          ), 100)::integer AS first_reward,
          COALESCE((
            SELECT repeat_activity_reward
            FROM economy_config
            WHERE config_key = 'default'
          ), 20)::integer AS repeat_reward,
          (
            SELECT rewarded_repeat_limit_per_day
            FROM economy_config
            WHERE config_key = 'default'
          )::integer AS repeat_limit,
          COALESCE((
            SELECT minimum_rewarded_attempt_interval_seconds
            FROM economy_config
            WHERE config_key = 'default'
          ), 30)::integer AS minimum_reward_interval_seconds,
          COALESCE((
            SELECT streak_tier_3_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 110)::integer AS tier_3,
          COALESCE((
            SELECT streak_tier_5_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 120)::integer AS tier_5,
          COALESCE((
            SELECT streak_tier_7_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 130)::integer AS tier_7
      ),
      local_clock AS (
        SELECT
          (CURRENT_TIMESTAMP AT TIME ZONE 'America/Fortaleza')::date
            AS local_date
      ),
      active_competition AS (
        SELECT period.id
        FROM competition_periods AS period
        WHERE
          period.status IN ('SCHEDULED', 'ACTIVE')
          AND period.starts_at <= CURRENT_TIMESTAMP
          AND period.ends_at > CURRENT_TIMESTAMP
        ORDER BY period.starts_at DESC
        LIMIT 1
      ),
      eligible_attempt AS (
        SELECT
          $1::uuid AS attempt_id,
          $2::uuid AS activity_session_id,
          $3 AS activity_id,
          u.firebase_uid,
          u.class_group,
          u.current_phase,
          u.current_streak,
          u.last_streak_date,
          sp.status,
          (sp.status = 'IN_PROGRESS') AS first_completion,
          settings.*,
          local_clock.local_date,
          (
            SELECT COUNT(*)::integer
            FROM activity_attempts AS previous
            WHERE
              previous.user_uid = u.firebase_uid
              AND previous.passed = TRUE
              AND previous.first_completion = FALSE
              AND previous.reward_amount > 0
              AND (
                previous.created_at
                AT TIME ZONE 'America/Fortaleza'
              )::date = local_clock.local_date
          ) AS rewarded_repeats_today,
          (
            SELECT MAX(previous.created_at)
            FROM activity_attempts AS previous
            WHERE
              previous.user_uid = u.firebase_uid
              AND previous.passed = TRUE
              AND previous.reward_amount > 0
          ) AS last_rewarded_attempt_at
        FROM users AS u
        INNER JOIN student_progress AS sp
          ON sp.user_uid = u.firebase_uid
          AND sp.phase_number = $4
        CROSS JOIN settings
        CROSS JOIN local_clock
        WHERE
          u.firebase_uid = $8
          AND EXISTS (
            SELECT 1
            FROM activity_sessions AS session
            WHERE
              session.id = $2::uuid
              AND session.user_uid = $8
              AND session.activity_id = $3
              AND session.phase_number = $4
              AND session.status = 'OPEN'
              AND session.expires_at > CURRENT_TIMESTAMP
          )
          AND (
            (
              sp.status = 'IN_PROGRESS'
              AND u.current_phase = $4
            )
            OR (
              sp.status = 'COMPLETED'
              AND $4 <= u.current_phase
            )
          )
          AND $4 BETWEEN 1 AND 4
          AND $5 BETWEEN 60 AND 100
          AND $6 >= 1
          AND $7 >= 0
          AND LENGTH($3) BETWEEN 1 AND 128
      ),
      reward_policy AS (
        SELECT
          eligible_attempt.*,
          (
            NOT first_completion
            AND repeat_limit IS NOT NULL
            AND rewarded_repeats_today >= repeat_limit
          ) AS reward_limit_reached,
          CASE
            WHEN NOT first_completion
              AND last_rewarded_attempt_at IS NOT NULL
              AND last_rewarded_attempt_at > (
                CURRENT_TIMESTAMP
                - minimum_reward_interval_seconds * INTERVAL '1 second'
              ) THEN 'RATE_LIMIT'
            WHEN NOT first_completion
              AND repeat_limit IS NOT NULL
              AND rewarded_repeats_today >= repeat_limit
              THEN 'DAILY_LIMIT'
            ELSE 'NONE'
          END::reward_suppression_reason AS reward_suppression_reason,
          CASE
            WHEN first_completion THEN first_reward
            WHEN last_rewarded_attempt_at IS NOT NULL
              AND last_rewarded_attempt_at > (
                CURRENT_TIMESTAMP
                - minimum_reward_interval_seconds * INTERVAL '1 second'
              ) THEN 0
            WHEN repeat_limit IS NULL
              OR rewarded_repeats_today < repeat_limit
              THEN repeat_reward
            ELSE 0
          END AS reward_base
        FROM eligible_attempt
      ),
      streak_seed AS (
        SELECT
          reward_policy.*,
          CASE
            WHEN reward_base <= 0 THEN current_streak
            WHEN last_streak_date = local_date
              THEN GREATEST(current_streak, 1)
            WHEN last_streak_date = local_date - 1
              THEN current_streak + 1
            ELSE 1
          END AS next_streak
        FROM reward_policy
      ),
      reward_context AS (
        SELECT
          streak_seed.*,
          100 AS multiplier_percent
        FROM streak_seed
      ),
      reward_values AS (
        SELECT
          reward_context.*,
          FLOOR(
            reward_base * multiplier_percent / 100.0
          )::integer AS reward_amount
        FROM reward_context
      ),
      created_attempt AS (
        INSERT INTO activity_attempts (
          id,
          user_uid,
          activity_id,
          activity_session_id,
          phase_number,
          score,
          correct_answers,
          wrong_answers,
          passed,
          first_completion,
          reward_base,
          streak_multiplier_percent,
          streak_bonus,
          reward_amount,
          reward_limit_reached,
          reward_suppression_reason,
          created_at
        )
        SELECT
          attempt_id,
          firebase_uid,
          activity_id,
          activity_session_id,
          $4,
          $5,
          $6,
          $7,
          TRUE,
          first_completion,
          reward_base,
          multiplier_percent,
          reward_amount - reward_base,
          reward_amount,
          reward_limit_reached,
          reward_suppression_reason,
          CURRENT_TIMESTAMP
        FROM reward_values
        ON CONFLICT (id) DO NOTHING
        RETURNING id, user_uid, phase_number
      ),
      updated_progress AS (
        UPDATE student_progress AS sp
        SET
          status = 'COMPLETED',
          score = GREATEST(sp.score, $5),
          attempts = sp.attempts + 1,
          correct_answers = GREATEST(sp.correct_answers, $6),
          wrong_answers = sp.wrong_answers + $7,
          completed_at = COALESCE(sp.completed_at, CURRENT_TIMESTAMP),
          updated_at = CURRENT_TIMESTAMP
        FROM created_attempt
        WHERE
          sp.user_uid = created_attempt.user_uid
          AND sp.phase_number = created_attempt.phase_number
        RETURNING sp.user_uid
      ),
      rewarded_user AS (
        UPDATE users AS u
        SET
          current_phase = CASE
            WHEN values.first_completion
              THEN LEAST(u.current_phase + 1, 4)
            ELSE u.current_phase
          END,
          capi_coins = u.capi_coins + values.reward_amount,
          current_streak = CASE
            WHEN values.reward_amount > 0 THEN values.next_streak
            ELSE u.current_streak
          END,
          last_streak_date = CASE
            WHEN values.reward_amount > 0 THEN values.local_date
            ELSE u.last_streak_date
          END,
          updated_at = CURRENT_TIMESTAMP
        FROM created_attempt
        INNER JOIN reward_values AS values
          ON values.attempt_id = created_attempt.id
        WHERE u.firebase_uid = created_attempt.user_uid
        RETURNING
          u.firebase_uid,
          created_attempt.id AS attempt_id,
          values.activity_id,
          values.first_completion,
          values.reward_base,
          values.multiplier_percent,
          values.reward_amount,
          values.class_group,
          values.local_date
      )
      INSERT INTO capi_coin_transactions (
        user_uid,
        attempt_id,
        amount,
        base_amount,
        streak_multiplier_percent,
        streak_bonus,
        transaction_type,
        reason,
        source_id,
        phase_number,
        class_group,
        competition_period_id,
        competition_week,
        created_at
      )
      SELECT
        rewarded_user.firebase_uid,
        rewarded_user.attempt_id,
        rewarded_user.reward_amount,
        rewarded_user.reward_base,
        rewarded_user.multiplier_percent,
        rewarded_user.reward_amount - rewarded_user.reward_base,
        CASE
          WHEN rewarded_user.first_completion THEN 'ACTIVITY_REWARD'
          ELSE 'ACTIVITY_REPEAT_REWARD'
        END::capi_coin_transaction_type,
        CASE
          WHEN rewarded_user.first_completion
            THEN CONCAT('Atividade da Fase ', $4::text)
          ELSE CONCAT('Revisão da atividade da Fase ', $4::text)
        END,
        $3,
        $4,
        rewarded_user.class_group,
        (SELECT id FROM active_competition),
        (
          rewarded_user.local_date
          - (
            EXTRACT(ISODOW FROM rewarded_user.local_date)::integer - 1
          )
        )::date,
        CURRENT_TIMESTAMP
      FROM rewarded_user
      WHERE rewarded_user.reward_amount > 0
    """
    params: [
      $attemptId
      $sessionId
      $activityId
      $phaseNumber
      $score
      $correctAnswers
      $wrongAnswers
      $studentUid
    ]
  )
}

mutation UpdateAuthoritativeActivitySessionState(
  $sessionId: UUID!
  $studentUid: String!
  $answerKey: Any!
  $publicPayload: Any!
) @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      UPDATE activity_sessions
      SET
        answer_key = $3::jsonb,
        public_payload = $4::jsonb,
        updated_at = CURRENT_TIMESTAMP
      WHERE id = $1::uuid
        AND user_uid = $2
        AND status = 'OPEN'
        AND expires_at > CURRENT_TIMESTAMP
    """
    params: [$sessionId, $studentUid, $answerKey, $publicPayload]
  )
}

# Uma única instrução PostgreSQL valida a atomicidade da carga: ou o lote
# inteiro e seu hash são gravados, ou nenhuma linha é alterada.
mutation ImportPedagogicalBank(
  $loadHash: String!
  $loadVersion: String!
  $sourceFile: String!
  $itemCount: Int!
  $items: Any!
) @auth(level: NO_ACCESS) {
  importedRows: _execute(
    sql: """
      WITH input_items AS (
        SELECT parsed.*
        FROM jsonb_to_recordset($5::jsonb) AS parsed(
          activity_id text,
          version text,
          item_id text,
          phase_number integer,
          item_type text,
          character_id text,
          difficulty text,
          stage integer,
          path_condition text,
          public_payload jsonb,
          secret_payload jsonb,
          source_id text,
          source_url text,
          tags text[],
          active boolean,
          review_status text,
          origin text,
          content_hash text
        )
      ), import_stats AS (
        SELECT
          COUNT(*) FILTER (WHERE existing.item_id IS NULL)::integer
            AS inserted_count,
          COUNT(*) FILTER (
            WHERE existing.item_id IS NOT NULL
              AND existing.content_hash IS DISTINCT FROM input.content_hash
          )::integer AS updated_count,
          COUNT(*) FILTER (
            WHERE existing.item_id IS NOT NULL
              AND existing.content_hash = input.content_hash
          )::integer AS ignored_count
        FROM input_items AS input
        LEFT JOIN pedagogical_items AS existing
          ON existing.activity_id = input.activity_id
          AND existing.version = input.version
          AND existing.item_id = input.item_id
      ), load_record AS (
        INSERT INTO pedagogical_bank_loads (
          load_hash,
          load_version,
          source_file,
          item_count,
          inserted_count,
          updated_count,
          ignored_count,
          rejected_count,
          imported_at
        )
        SELECT
          $1,
          $2,
          $3,
          $4,
          import_stats.inserted_count,
          import_stats.updated_count,
          import_stats.ignored_count,
          0,
          NOW()
        FROM import_stats
        ON CONFLICT (load_hash) DO UPDATE SET
          load_version = EXCLUDED.load_version,
          source_file = EXCLUDED.source_file,
          item_count = EXCLUDED.item_count,
          inserted_count = EXCLUDED.inserted_count,
          updated_count = EXCLUDED.updated_count,
          ignored_count = EXCLUDED.ignored_count,
          rejected_count = 0,
          imported_at = NOW()
        RETURNING load_hash
      )
      INSERT INTO pedagogical_items (
        activity_id,
        version,
        item_id,
        phase_number,
        item_type,
        character_id,
        difficulty,
        stage,
        path_condition,
        public_payload,
        secret_payload,
        source_id,
        source_url,
        tags,
        active,
        review_status,
        origin,
        content_hash,
        load_hash,
        created_at,
        updated_at
      )
      SELECT
        input.activity_id,
        input.version,
        input.item_id,
        input.phase_number,
        input.item_type::pedagogical_item_type,
        NULLIF(input.character_id, ''),
        input.difficulty::pedagogical_difficulty,
        input.stage,
        NULLIF(input.path_condition, ''),
        input.public_payload,
        input.secret_payload,
        input.source_id,
        input.source_url,
        input.tags,
        input.active,
        input.review_status::pedagogical_review_status,
        input.origin,
        input.content_hash,
        load_record.load_hash,
        NOW(),
        NOW()
      FROM input_items AS input
      CROSS JOIN load_record
      ON CONFLICT (activity_id, version, item_id) DO UPDATE SET
        phase_number = EXCLUDED.phase_number,
        item_type = EXCLUDED.item_type,
        character_id = EXCLUDED.character_id,
        difficulty = EXCLUDED.difficulty,
        stage = EXCLUDED.stage,
        path_condition = EXCLUDED.path_condition,
        public_payload = EXCLUDED.public_payload,
        secret_payload = EXCLUDED.secret_payload,
        source_id = EXCLUDED.source_id,
        source_url = EXCLUDED.source_url,
        tags = EXCLUDED.tags,
        active = EXCLUDED.active,
        review_status = EXCLUDED.review_status,
        origin = EXCLUDED.origin,
        content_hash = EXCLUDED.content_hash,
        load_hash = EXCLUDED.load_hash,
        updated_at = NOW()
      WHERE pedagogical_items.content_hash IS DISTINCT FROM EXCLUDED.content_hash
    """
    params: [
      $loadHash
      $loadVersion
      $sourceFile
      $itemCount
      $items
    ]
  )
}

mutation BindPilotClass(
  $studentUid: String!
  $classGroup: StudentClass!
) @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      UPDATE users
      SET
        class_group = COALESCE(class_group, $2::student_class),
        updated_at = CURRENT_TIMESTAMP
      WHERE firebase_uid = $1
        AND role = 'STUDENT'
        AND (class_group IS NULL OR class_group = $2::student_class)
    """
    params: [$studentUid, $classGroup]
  )
}

mutation UpsertPilotCompetitionPeriod(
  $periodId: UUID!
  $periodKey: String!
  $name: String!
  $startsAt: Timestamp!
  $endsAt: Timestamp!
  $schedule: Any!
) @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      INSERT INTO competition_periods (
        id,
        period_key,
        name,
        time_zone,
        schedule,
        status,
        active_slot,
        starts_at,
        ends_at,
        created_at,
        updated_at
      ) VALUES (
        $1::uuid,
        $2,
        $3,
        'America/Fortaleza',
        $6::jsonb,
        'SCHEDULED',
        NULL,
        $4,
        $5,
        CURRENT_TIMESTAMP,
        CURRENT_TIMESTAMP
      )
      ON CONFLICT (period_key) DO UPDATE SET
        name = EXCLUDED.name,
        time_zone = EXCLUDED.time_zone,
        schedule = EXCLUDED.schedule,
        starts_at = EXCLUDED.starts_at,
        ends_at = EXCLUDED.ends_at,
        updated_at = CURRENT_TIMESTAMP
      WHERE competition_periods.status <> 'CLOSED'
    """
    params: [$periodId, $periodKey, $name, $startsAt, $endsAt, $schedule]
  )
}

mutation SeedLoadTestStudents(
  $runId: String!
  $requestedUsers: Int!
  $users: Any!
) @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      WITH input_users AS (
        SELECT parsed.*
        FROM jsonb_to_recordset($3::jsonb) AS parsed(
          firebase_uid text,
          email text,
          preferred_name text
        )
      ), run_record AS (
        INSERT INTO load_test_runs (
          run_id,
          status,
          requested_users,
          created_users,
          started_at
        ) VALUES ($1, 'SEEDED', $2, 0, CURRENT_TIMESTAMP)
        ON CONFLICT (run_id) DO UPDATE SET
          status = 'SEEDED',
          requested_users = EXCLUDED.requested_users,
          started_at = CURRENT_TIMESTAMP
        RETURNING run_id
      ), seeded_users AS (
        INSERT INTO users (
          firebase_uid,
          email,
          preferred_name,
          class_group,
          role,
          profile_completed,
          is_test,
          test_run_id,
          origin,
          capi_coins,
          current_phase,
          current_streak,
          created_at,
          updated_at
        )
        SELECT
          input.firebase_uid,
          input.email,
          input.preferred_name,
          NULL,
          'STUDENT',
          TRUE,
          TRUE,
          $1,
          'LOAD_TEST',
          0,
          1,
          0,
          CURRENT_TIMESTAMP,
          CURRENT_TIMESTAMP
        FROM input_users AS input
        CROSS JOIN run_record
        ON CONFLICT (firebase_uid) DO UPDATE SET
          email = EXCLUDED.email,
          preferred_name = EXCLUDED.preferred_name,
          class_group = NULL,
          profile_completed = TRUE,
          is_test = TRUE,
          test_run_id = EXCLUDED.test_run_id,
          origin = 'LOAD_TEST',
          capi_coins = 0,
          current_phase = 1,
          updated_at = CURRENT_TIMESTAMP
        WHERE users.is_test = TRUE AND users.origin = 'LOAD_TEST'
        RETURNING firebase_uid
      ), seeded_progress AS (
        INSERT INTO student_progress (
          user_uid,
          phase_number,
          status,
          score,
          attempts,
          correct_answers,
          wrong_answers,
          started_at,
          updated_at
        )
        SELECT
          seeded.firebase_uid,
          1,
          'IN_PROGRESS',
          0,
          0,
          0,
          0,
          CURRENT_TIMESTAMP,
          CURRENT_TIMESTAMP
        FROM seeded_users AS seeded
        ON CONFLICT (user_uid, phase_number) DO UPDATE SET
          status = 'IN_PROGRESS',
          score = 0,
          attempts = 0,
          correct_answers = 0,
          wrong_answers = 0,
          started_at = CURRENT_TIMESTAMP,
          completed_at = NULL,
          updated_at = CURRENT_TIMESTAMP
        RETURNING user_uid
      )
      UPDATE load_test_runs
      SET created_users = (SELECT COUNT(*)::integer FROM seeded_users)
      WHERE run_id = $1
    """
    params: [$runId, $requestedUsers, $users]
  )
}

mutation RecordLoadTestMetrics(
  $runId: String!
  $status: String!
  $metrics: Any!
) @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      UPDATE load_test_runs
      SET
        status = $2,
        metrics = $3::jsonb,
        completed_at = CURRENT_TIMESTAMP
      WHERE run_id = $1
    """
    params: [$runId, $status, $metrics]
  )
}

mutation CleanupMarkedLoadTestStudents($runId: String!)
  @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      WITH deleted_users AS (
        DELETE FROM users
        WHERE is_test = TRUE
          AND origin = 'LOAD_TEST'
          AND firebase_uid LIKE 'loadtest-%'
        RETURNING firebase_uid
      )
      UPDATE load_test_runs
      SET
        status = 'DATABASE_CLEANED',
        deleted_database_users = (SELECT COUNT(*)::integer FROM deleted_users),
        cleaned_at = CURRENT_TIMESTAMP
      WHERE run_id = $1
    """
    params: [$runId]
  )
}

mutation FinalizeLoadTestCleanup(
  $runId: String!
  $deletedAuthUsers: Int!
) @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      UPDATE load_test_runs
      SET
        status = 'CLEANED',
        deleted_auth_users = $2,
        cleaned_at = CURRENT_TIMESTAMP
      WHERE run_id = $1
    """
    params: [$runId, $deletedAuthUsers]
  )
}
