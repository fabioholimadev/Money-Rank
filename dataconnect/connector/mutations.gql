mutation UpdateLearningModuleDraftEditorial(
  $versionId: UUID!
  $title: String!
  $changeSummary: String!
  $payload: Any!
  $actorUid: String!
) @auth(level: NO_ACCESS) {
  updatedCount: _execute(
    sql: """
      WITH updated AS (
        UPDATE learning_module_versions
        SET
          title = BTRIM($2),
          change_summary = BTRIM($3),
          payload = $4::jsonb,
          updated_at = CURRENT_TIMESTAMP
        WHERE
          id = $1::uuid
          AND status = 'DRAFT'
        RETURNING id, module_key, version, status
      )
      INSERT INTO editorial_audit_log (
        id, entity_type, entity_id, entity_key, version, action,
        actor_uid, summary, details, created_at
      )
      SELECT
        gen_random_uuid(), 'LEARNING_MODULE', id, module_key, version,
        'UPDATED', $5, BTRIM($3),
        jsonb_build_object('status', status::text), CURRENT_TIMESTAMP
      FROM updated
    """
    params: [$versionId, $title, $changeSummary, $payload, $actorUid]
  )
}

