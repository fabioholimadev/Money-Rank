  $studentUid: String!
  $activityId: String!
  $phaseNumber: Int!
  $variantId: String
  $contentVersion: String!
  $publicPayload: Any!
  $answerKey: Any!
  $expiresAt: Timestamp!
) @auth(level: NO_ACCESS) {
  activitySession_insert(
    data: {
      id: $sessionId
      userUid: $studentUid
      activityId: $activityId
      phaseNumber: $phaseNumber
      variantId: $variantId
      contentVersion: $contentVersion
      publicPayload: $publicPayload
      answerKey: $answerKey
      status: OPEN
      expiresAt: $expiresAt
      createdAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
}

mutation MarkAuthoritativeActivitySessionSubmitted(
