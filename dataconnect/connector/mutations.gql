# Migração segura para perfis criados antes do Passo 0. Somente alunos que
# ainda não possuem nenhum progresso podem voltar de 1 para 0.
mutation InitializeMyTrail @auth(level: USER_EMAIL_VERIFIED) {
  affectedRows: _execute(
    sql: """
      UPDATE users AS u
      SET
        current_phase = 0,
        updated_at = CURRENT_TIMESTAMP
      WHERE
        u.firebase_uid = $1
        AND u.current_phase = 1
        AND NOT EXISTS (
          SELECT 1
          FROM student_progress AS sp
          WHERE sp.user_uid = u.firebase_uid
        )
    """
    params: [{ _expr: "auth.uid" }]
  )
}

# O Passo 0 é concluído uma única vez. A mesma instrução SQL registra o
# progresso, libera a Fase 1, credita a recompensa de conteúdo e cria o
# lançamento no livro-caixa.
mutation CompleteMyIntroduction @auth(level: USER_EMAIL_VERIFIED) {
  affectedRows: _execute(
    sql: """
      WITH settings AS (
        SELECT
          COALESCE((
            SELECT first_content_reward
            FROM economy_config
            WHERE config_key = 'default'
          ), 20)::integer AS base_reward,
          COALESCE((
            SELECT streak_tier_3_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 110)::integer AS tier_3,
          COALESCE((
            SELECT streak_tier_5_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 120)::integer AS tier_5,
          COALESCE((
            SELECT streak_tier_7_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 130)::integer AS tier_7
      ),
      local_clock AS (
        SELECT
          (CURRENT_TIMESTAMP AT TIME ZONE 'America/Fortaleza')::date
            AS local_date
      ),
      active_competition AS (
        SELECT period.id
        FROM competition_periods AS period
        WHERE
          period.status IN ('SCHEDULED', 'ACTIVE')
          AND period.starts_at <= CURRENT_TIMESTAMP
          AND period.ends_at > CURRENT_TIMESTAMP
        ORDER BY period.starts_at DESC
        LIMIT 1
      ),
      completed_progress AS (
        INSERT INTO student_progress (
          user_uid,
          phase_number,
          status,
          score,
          attempts,
          correct_answers,
          wrong_answers,
          started_at,
          completed_at,
          updated_at
        )
        SELECT
          u.firebase_uid,
          0,
          'COMPLETED',
          100,
          1,
          1,
          0,
          CURRENT_TIMESTAMP,
          CURRENT_TIMESTAMP,
          CURRENT_TIMESTAMP
        FROM users AS u
        WHERE
          u.firebase_uid = $1
          AND u.current_phase = 0
        ON CONFLICT (user_uid, phase_number) DO NOTHING
        RETURNING user_uid
      ),
      reward_seed AS (
        SELECT
          u.firebase_uid,
          u.class_group,
          settings.base_reward,
          settings.tier_3,
          settings.tier_5,
          settings.tier_7,
          local_clock.local_date,
          CASE
            WHEN u.last_streak_date = local_clock.local_date
              THEN GREATEST(u.current_streak, 1)
            WHEN u.last_streak_date = local_clock.local_date - 1
              THEN u.current_streak + 1
            ELSE 1
          END AS next_streak
        FROM users AS u
        INNER JOIN completed_progress AS progress
          ON progress.user_uid = u.firebase_uid
        CROSS JOIN settings
        CROSS JOIN local_clock
      ),
      reward_context AS (
        SELECT
          reward_seed.*,
          CASE
            WHEN next_streak >= 7 THEN tier_7
            WHEN next_streak >= 5 THEN tier_5
            WHEN next_streak >= 3 THEN tier_3
            ELSE 100
          END AS multiplier_percent
        FROM reward_seed
      ),
      reward_values AS (
        SELECT
          reward_context.*,
          ROUND(
            base_reward * multiplier_percent / 100.0
          )::integer AS reward_amount
        FROM reward_context
      ),
      credited_user AS (
        UPDATE users AS u
        SET
          current_phase = 1,
          capi_coins = u.capi_coins + values.reward_amount,
          current_streak = values.next_streak,
          last_streak_date = values.local_date,
          updated_at = CURRENT_TIMESTAMP
        FROM reward_values AS values
        WHERE u.firebase_uid = values.firebase_uid
        RETURNING
          u.firebase_uid,
          values.class_group,
          values.base_reward,
          values.multiplier_percent,
          values.reward_amount,
          values.local_date
      )
      INSERT INTO capi_coin_transactions (
        user_uid,
        amount,
        base_amount,
        streak_multiplier_percent,
        streak_bonus,
        transaction_type,
        reason,
        source_id,
        phase_number,
        class_group,
        competition_period_id,
        competition_week,
        created_at
      )
      SELECT
        credited_user.firebase_uid,
        credited_user.reward_amount,
        credited_user.base_reward,
        credited_user.multiplier_percent,
        credited_user.reward_amount - credited_user.base_reward,
        'CONTENT_REWARD',
        'Conclusão do Passo 0',
        'introduction-0',
        0,
        credited_user.class_group,
        (SELECT id FROM active_competition),
        (
          credited_user.local_date
          - (
            EXTRACT(ISODOW FROM credited_user.local_date)::integer - 1
          )
        )::date,
        CURRENT_TIMESTAMP
      FROM credited_user
    """
    params: [{ _expr: "auth.uid" }]
  )
}

# Ao concluir o conteúdo da fase atual, cria o estado IN_PROGRESS e paga a
# recompensa de conteúdo. O INSERT com conflito ignorado garante idempotência.
mutation CompleteMyCurrentPhaseContent($phaseNumber: Int!)
  @auth(level: USER_EMAIL_VERIFIED) {
  affectedRows: _execute(
    sql: """
      WITH settings AS (
        SELECT
          COALESCE((
            SELECT first_content_reward
            FROM economy_config
            WHERE config_key = 'default'
          ), 20)::integer AS base_reward,
          COALESCE((
            SELECT streak_tier_3_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 110)::integer AS tier_3,
          COALESCE((
            SELECT streak_tier_5_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 120)::integer AS tier_5,
          COALESCE((
            SELECT streak_tier_7_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 130)::integer AS tier_7
      ),
      local_clock AS (
        SELECT
          (CURRENT_TIMESTAMP AT TIME ZONE 'America/Fortaleza')::date
            AS local_date
      ),
      active_competition AS (
        SELECT period.id
        FROM competition_periods AS period
        WHERE
          period.status IN ('SCHEDULED', 'ACTIVE')
          AND period.starts_at <= CURRENT_TIMESTAMP
          AND period.ends_at > CURRENT_TIMESTAMP
        ORDER BY period.starts_at DESC
        LIMIT 1
      ),
      started_progress AS (
        INSERT INTO student_progress (
          user_uid,
          phase_number,
          status,
          score,
          attempts,
          correct_answers,
          wrong_answers,
          started_at,
          updated_at
        )
        SELECT
          u.firebase_uid,
          $1,
          'IN_PROGRESS',
          0,
          0,
          0,
          0,
          CURRENT_TIMESTAMP,
          CURRENT_TIMESTAMP
        FROM users AS u
        WHERE
          u.firebase_uid = $2
          AND u.current_phase = $1
          AND $1 BETWEEN 1 AND 4
        ON CONFLICT (user_uid, phase_number) DO UPDATE
        SET
          status = 'IN_PROGRESS',
          started_at = COALESCE(
            student_progress.started_at,
            CURRENT_TIMESTAMP
          ),
          updated_at = CURRENT_TIMESTAMP
        WHERE student_progress.status = 'NOT_STARTED'
        RETURNING user_uid
      ),
      reward_seed AS (
        SELECT
          u.firebase_uid,
          u.class_group,
          settings.base_reward,
          settings.tier_3,
          settings.tier_5,
          settings.tier_7,
          local_clock.local_date,
          CASE
            WHEN u.last_streak_date = local_clock.local_date
              THEN GREATEST(u.current_streak, 1)
            WHEN u.last_streak_date = local_clock.local_date - 1
              THEN u.current_streak + 1
            ELSE 1
          END AS next_streak
        FROM users AS u
        INNER JOIN started_progress AS progress
          ON progress.user_uid = u.firebase_uid
        CROSS JOIN settings
        CROSS JOIN local_clock
      ),
      reward_context AS (
        SELECT
          reward_seed.*,
          CASE
            WHEN next_streak >= 7 THEN tier_7
            WHEN next_streak >= 5 THEN tier_5
            WHEN next_streak >= 3 THEN tier_3
            ELSE 100
          END AS multiplier_percent
        FROM reward_seed
      ),
      reward_values AS (
        SELECT
          reward_context.*,
          ROUND(
            base_reward * multiplier_percent / 100.0
          )::integer AS reward_amount
        FROM reward_context
      ),
      credited_user AS (
        UPDATE users AS u
        SET
          capi_coins = u.capi_coins + values.reward_amount,
          current_streak = values.next_streak,
          last_streak_date = values.local_date,
          updated_at = CURRENT_TIMESTAMP
        FROM reward_values AS values
        WHERE u.firebase_uid = values.firebase_uid
        RETURNING
          u.firebase_uid,
          values.class_group,
          values.base_reward,
          values.multiplier_percent,
          values.reward_amount,
          values.local_date
      )
      INSERT INTO capi_coin_transactions (
        user_uid,
        amount,
        base_amount,
        streak_multiplier_percent,
        streak_bonus,
        transaction_type,
        reason,
        source_id,
        phase_number,
        class_group,
        competition_period_id,
        competition_week,
        created_at
      )
      SELECT
        credited_user.firebase_uid,
        credited_user.reward_amount,
        credited_user.base_reward,
        credited_user.multiplier_percent,
        credited_user.reward_amount - credited_user.base_reward,
        'CONTENT_REWARD',
        CONCAT('Conteúdo da Fase ', $1::text),
        CONCAT('phase-', $1::text, '-content'),
        $1,
        credited_user.class_group,
        (SELECT id FROM active_competition),
        (
          credited_user.local_date
          - (
            EXTRACT(ISODOW FROM credited_user.local_date)::integer - 1
          )
        )::date,
        CURRENT_TIMESTAMP
      FROM credited_user
    """
    params: [$phaseNumber, { _expr: "auth.uid" }]
  )
}

# Registra uma tentativa que ainda não alcançou a pontuação mínima. Não libera
# a próxima fase e não gera moedas.
mutation RegisterMyCurrentPhaseAttempt(
  $attemptId: UUID!
  $sessionId: UUID!
  $studentUid: String!
  $activityId: String!
  $phaseNumber: Int!
  $score: Int!
  $correctAnswers: Int!
  $wrongAnswers: Int!
)
  @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      WITH eligible_attempt AS (
        SELECT
          sp.user_uid,
          sp.phase_number
        FROM student_progress AS sp
        INNER JOIN users AS u
          ON u.firebase_uid = sp.user_uid
        WHERE
          sp.user_uid = $8
          AND sp.phase_number = $4
          AND EXISTS (
            SELECT 1
            FROM activity_sessions AS session
            WHERE
              session.id = $2::uuid
              AND session.user_uid = $8
              AND session.activity_id = $3
              AND session.phase_number = $4
              AND session.status = 'OPEN'
              AND session.expires_at > CURRENT_TIMESTAMP
          )
          AND (
            (
              sp.status = 'IN_PROGRESS'
              AND u.current_phase = $4
            )
            OR (
              sp.status = 'COMPLETED'
              AND $4 <= u.current_phase
            )
          )
          AND $4 BETWEEN 1 AND 4
          AND $5 BETWEEN 0 AND 59
          AND $6 >= 0
          AND $7 >= 0
          AND LENGTH($3) BETWEEN 1 AND 128
      ),
      created_attempt AS (
        INSERT INTO activity_attempts (
          id,
          user_uid,
          activity_id,
          activity_session_id,
          phase_number,
          score,
          correct_answers,
          wrong_answers,
          passed,
          first_completion,
          reward_base,
          streak_multiplier_percent,
          streak_bonus,
          reward_amount,
          reward_limit_reached,
          created_at
        )
        SELECT
          $1::uuid,
          eligible_attempt.user_uid,
          $3,
          $2::uuid,
          $4,
          $5,
          $6,
          $7,
          FALSE,
          FALSE,
          0,
          100,
          0,
          0,
          FALSE,
          CURRENT_TIMESTAMP
        FROM eligible_attempt
        ON CONFLICT (id) DO NOTHING
        RETURNING user_uid, phase_number
      )
      UPDATE student_progress AS sp
      SET
        score = GREATEST(sp.score, $5),
        attempts = sp.attempts + 1,
        correct_answers = GREATEST(sp.correct_answers, $6),
        wrong_answers = sp.wrong_answers + $7,
        updated_at = CURRENT_TIMESTAMP
      FROM created_attempt
      WHERE
        sp.user_uid = created_attempt.user_uid
        AND sp.phase_number = created_attempt.phase_number
    """
    params: [
      $attemptId
      $sessionId
      $activityId
      $phaseNumber
      $score
      $correctAnswers
      $wrongAnswers
      $studentUid
    ]
  )
}

# Conclusão atômica e idempotente da atividade atual. A pontuação mínima é
# validada na autorização; o SQL só aceita a fase corrente em IN_PROGRESS.
# O streak usa CURRENT_DATE do servidor:
# - mesma data: mantém o valor;
# - dia imediatamente anterior: soma um;
# - intervalo maior: reinicia em um.
mutation CompleteMyCurrentPhase(
  $attemptId: UUID!
  $sessionId: UUID!
  $studentUid: String!
  $activityId: String!
  $phaseNumber: Int!
  $score: Int!
  $correctAnswers: Int!
  $wrongAnswers: Int!
)
  @auth(level: NO_ACCESS) {
  affectedRows: _execute(
    sql: """
      WITH settings AS (
        SELECT
          COALESCE((
            SELECT first_activity_reward
            FROM economy_config
            WHERE config_key = 'default'
          ), 100)::integer AS first_reward,
          COALESCE((
            SELECT repeat_activity_reward
            FROM economy_config
            WHERE config_key = 'default'
          ), 20)::integer AS repeat_reward,
          (
            SELECT rewarded_repeat_limit_per_day
            FROM economy_config
            WHERE config_key = 'default'
          )::integer AS repeat_limit,
          COALESCE((
            SELECT minimum_rewarded_attempt_interval_seconds
            FROM economy_config
            WHERE config_key = 'default'
          ), 30)::integer AS minimum_reward_interval_seconds,
          COALESCE((
            SELECT streak_tier_3_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 110)::integer AS tier_3,
          COALESCE((
            SELECT streak_tier_5_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 120)::integer AS tier_5,
          COALESCE((
            SELECT streak_tier_7_percent
            FROM economy_config
            WHERE config_key = 'default'
          ), 130)::integer AS tier_7
      ),
      local_clock AS (
        SELECT
          (CURRENT_TIMESTAMP AT TIME ZONE 'America/Fortaleza')::date
            AS local_date
      ),
      active_competition AS (
        SELECT period.id
        FROM competition_periods AS period
        WHERE
          period.status IN ('SCHEDULED', 'ACTIVE')
          AND period.starts_at <= CURRENT_TIMESTAMP
          AND period.ends_at > CURRENT_TIMESTAMP
        ORDER BY period.starts_at DESC
        LIMIT 1
      ),
      eligible_attempt AS (
        SELECT
          $1::uuid AS attempt_id,
          $2::uuid AS activity_session_id,
          $3 AS activity_id,
          u.firebase_uid,
          u.class_group,
          u.current_phase,
          u.current_streak,
          u.last_streak_date,
          sp.status,
          (sp.status = 'IN_PROGRESS') AS first_completion,
          settings.*,
          local_clock.local_date,
          (
            SELECT COUNT(*)::integer
            FROM activity_attempts AS previous
            WHERE
              previous.user_uid = u.firebase_uid
              AND previous.passed = TRUE
              AND previous.first_completion = FALSE
              AND previous.reward_amount > 0
              AND (
                previous.created_at
                AT TIME ZONE 'America/Fortaleza'
              )::date = local_clock.local_date
          ) AS rewarded_repeats_today,
          (
            SELECT MAX(previous.created_at)
            FROM activity_attempts AS previous
            WHERE
              previous.user_uid = u.firebase_uid
              AND previous.passed = TRUE
              AND previous.reward_amount > 0
          ) AS last_rewarded_attempt_at
        FROM users AS u
        INNER JOIN student_progress AS sp
          ON sp.user_uid = u.firebase_uid
          AND sp.phase_number = $4
        CROSS JOIN settings
        CROSS JOIN local_clock
        WHERE
          u.firebase_uid = $8
          AND EXISTS (
            SELECT 1
            FROM activity_sessions AS session
            WHERE
              session.id = $2::uuid
              AND session.user_uid = $8
              AND session.activity_id = $3
              AND session.phase_number = $4
              AND session.status = 'OPEN'
              AND session.expires_at > CURRENT_TIMESTAMP
          )
          AND (
            (
              sp.status = 'IN_PROGRESS'
              AND u.current_phase = $4
            )
            OR (
              sp.status = 'COMPLETED'
              AND $4 <= u.current_phase
            )
          )
          AND $4 BETWEEN 1 AND 4
          AND $5 BETWEEN 60 AND 100
          AND $6 >= 1
          AND $7 >= 0
          AND LENGTH($3) BETWEEN 1 AND 128
      ),
      reward_policy AS (
        SELECT
          eligible_attempt.*,
          (
            NOT first_completion
            AND repeat_limit IS NOT NULL
            AND rewarded_repeats_today >= repeat_limit
          ) AS reward_limit_reached,
          CASE
            WHEN NOT first_completion
              AND last_rewarded_attempt_at IS NOT NULL
              AND last_rewarded_attempt_at > (
                CURRENT_TIMESTAMP
                - minimum_reward_interval_seconds * INTERVAL '1 second'
              ) THEN 'RATE_LIMIT'
            WHEN NOT first_completion
              AND repeat_limit IS NOT NULL
              AND rewarded_repeats_today >= repeat_limit
              THEN 'DAILY_LIMIT'
            ELSE 'NONE'
          END::reward_suppression_reason AS reward_suppression_reason,
          CASE
            WHEN first_completion THEN first_reward
            WHEN last_rewarded_attempt_at IS NOT NULL
              AND last_rewarded_attempt_at > (
                CURRENT_TIMESTAMP
                - minimum_reward_interval_seconds * INTERVAL '1 second'
              ) THEN 0
            WHEN repeat_limit IS NULL
              OR rewarded_repeats_today < repeat_limit
              THEN repeat_reward
            ELSE 0
          END AS reward_base
        FROM eligible_attempt
      ),
      streak_seed AS (
        SELECT
          reward_policy.*,
          CASE
            WHEN reward_base <= 0 THEN current_streak
            WHEN last_streak_date = local_date
              THEN GREATEST(current_streak, 1)
            WHEN last_streak_date = local_date - 1
              THEN current_streak + 1
            ELSE 1
          END AS next_streak
        FROM reward_policy
      ),
      reward_context AS (
        SELECT
          streak_seed.*,
          CASE
            WHEN reward_base <= 0 THEN 100
            WHEN next_streak >= 7 THEN tier_7
            WHEN next_streak >= 5 THEN tier_5
            WHEN next_streak >= 3 THEN tier_3
            ELSE 100
          END AS multiplier_percent
        FROM streak_seed
      ),
      reward_values AS (
        SELECT
          reward_context.*,
          ROUND(
            reward_base * multiplier_percent / 100.0
          )::integer AS reward_amount
        FROM reward_context
      ),
      created_attempt AS (
        INSERT INTO activity_attempts (
          id,
          user_uid,
          activity_id,
          activity_session_id,
          phase_number,
          score,
          correct_answers,
          wrong_answers,
          passed,
          first_completion,
          reward_base,
          streak_multiplier_percent,
          streak_bonus,
          reward_amount,
          reward_limit_reached,
          reward_suppression_reason,
          created_at
        )
        SELECT
          attempt_id,
          firebase_uid,
          activity_id,
          activity_session_id,
          $4,
          $5,
          $6,
          $7,
          TRUE,
          first_completion,
          reward_base,
          multiplier_percent,
          reward_amount - reward_base,
          reward_amount,
          reward_limit_reached,
          reward_suppression_reason,
          CURRENT_TIMESTAMP
        FROM reward_values
        ON CONFLICT (id) DO NOTHING
        RETURNING id, user_uid, phase_number
      ),
      updated_progress AS (
        UPDATE student_progress AS sp
        SET
          status = 'COMPLETED',
          score = GREATEST(sp.score, $5),
          attempts = sp.attempts + 1,
          correct_answers = GREATEST(sp.correct_answers, $6),
          wrong_answers = sp.wrong_answers + $7,
          completed_at = COALESCE(sp.completed_at, CURRENT_TIMESTAMP),
          updated_at = CURRENT_TIMESTAMP
        FROM created_attempt
        WHERE
          sp.user_uid = created_attempt.user_uid
          AND sp.phase_number = created_attempt.phase_number
        RETURNING sp.user_uid
      ),
      rewarded_user AS (
        UPDATE users AS u
        SET
          current_phase = CASE
            WHEN values.first_completion
              THEN LEAST(u.current_phase + 1, 4)
            ELSE u.current_phase
          END,
          capi_coins = u.capi_coins + values.reward_amount,
          current_streak = CASE
            WHEN values.reward_amount > 0 THEN values.next_streak
            ELSE u.current_streak
          END,
          last_streak_date = CASE
            WHEN values.reward_amount > 0 THEN values.local_date
            ELSE u.last_streak_date
          END,
          updated_at = CURRENT_TIMESTAMP
        FROM created_attempt
        INNER JOIN reward_values AS values
          ON values.attempt_id = created_attempt.id
        WHERE u.firebase_uid = created_attempt.user_uid
        RETURNING
          u.firebase_uid,
          created_attempt.id AS attempt_id,
          values.activity_id,
          values.first_completion,
          values.reward_base,
          values.multiplier_percent,
          values.reward_amount,
          values.class_group,
          values.local_date
      )
      INSERT INTO capi_coin_transactions (
        user_uid,
        attempt_id,
        amount,
        base_amount,
        streak_multiplier_percent,
        streak_bonus,
        transaction_type,
        reason,
        source_id,
        phase_number,
        class_group,
        competition_period_id,
        competition_week,
        created_at
      )
      SELECT
        rewarded_user.firebase_uid,
        rewarded_user.attempt_id,
        rewarded_user.reward_amount,
        rewarded_user.reward_base,
        rewarded_user.multiplier_percent,
        rewarded_user.reward_amount - rewarded_user.reward_base,
        CASE
          WHEN rewarded_user.first_completion THEN 'ACTIVITY_REWARD'
          ELSE 'ACTIVITY_REPEAT_REWARD'
        END::capi_coin_transaction_type,
        CASE
          WHEN rewarded_user.first_completion
            THEN CONCAT('Atividade da Fase ', $4::text)
          ELSE CONCAT('Revisão da atividade da Fase ', $4::text)
        END,
        $3,
        $4,
        rewarded_user.class_group,
        (SELECT id FROM active_competition),
        (
          rewarded_user.local_date
          - (
            EXTRACT(ISODOW FROM rewarded_user.local_date)::integer - 1
          )
        )::date,
        CURRENT_TIMESTAMP
      FROM rewarded_user
      WHERE rewarded_user.reward_amount > 0
    """
    params: [
      $attemptId
      $sessionId
      $activityId
      $phaseNumber
      $score
      $correctAnswers
      $wrongAnswers
      $studentUid
    ]
  )
}
