      repeatActivityReward: $repeatActivityReward
      rewardedRepeatLimitPerDay: $rewardedRepeatLimitPerDay
      minimumRewardedAttemptIntervalSeconds: $minimumRewardedAttemptIntervalSeconds
      streakTier3Percent: $streakTier3Percent
      streakTier5Percent: $streakTier5Percent
      streakTier7Percent: $streakTier7Percent
      updatedAt_expr: "request.time"
    }
  )
}

# Criação administrativa de um período. A operação impede datas inválidas e
# janelas sobrepostas. O navegador nunca recebe permissão para executá-la.
mutation CreateCompetitionPeriod(
  $periodId: UUID!
  $name: String!
  $startsAt: Timestamp!
  $endsAt: Timestamp!
  $status: CompetitionPeriodStatus!
) @auth(level: NO_ACCESS) {
  createdPeriod: _executeReturningFirst(
    sql: """
      INSERT INTO competition_periods (
        id,
        name,
        status,
        starts_at,
        ends_at,
        created_at,
        updated_at
      )
      SELECT
        $1::uuid,
        BTRIM($2),
        $5::competition_period_status,
        $3,
        $4,
        CURRENT_TIMESTAMP,
        CURRENT_TIMESTAMP
      WHERE
        LENGTH(BTRIM($2)) BETWEEN 3 AND 80
        AND $3 < $4
        AND $5::competition_period_status IN ('DRAFT', 'SCHEDULED')
        AND NOT EXISTS (
          SELECT 1
          FROM competition_periods AS existing
          WHERE
            existing.status <> 'CLOSED'
            AND existing.starts_at < $4
            AND existing.ends_at > $3
        )
      RETURNING
        id,
        name,
        status,
        starts_at,
        ends_at,
        paused_at,
        closed_at,
        created_at,
        updated_at
    """
    params: [$periodId, $name, $startsAt, $endsAt, $status]
  )
}

# Transições permitidas: rascunho pode ser agendado/ativado/encerrado;
# agendado pode ser ativado/pausado/encerrado; ativo pode ser pausado ou
# encerrado; pausado pode ser retomado ou encerrado. CLOSED é imutável.
mutation UpdateCompetitionPeriodStatus(
  $periodId: UUID!
  $status: CompetitionPeriodStatus!
) @auth(level: NO_ACCESS) {
  updatedPeriod: _executeReturningFirst(
    sql: """
      UPDATE competition_periods AS period
      SET
        status = $2::competition_period_status,
        active_slot = CASE
          WHEN $2::competition_period_status = 'ACTIVE' THEN 'ACTIVE'
          ELSE NULL
        END,
        paused_at = CASE
          WHEN $2::competition_period_status = 'PAUSED'
            THEN CURRENT_TIMESTAMP
          WHEN $2::competition_period_status = 'ACTIVE'
            THEN NULL
          ELSE period.paused_at
        END,
        closed_at = CASE
          WHEN $2::competition_period_status = 'CLOSED'
            THEN CURRENT_TIMESTAMP
          ELSE period.closed_at
        END,
        updated_at = CURRENT_TIMESTAMP
      WHERE
        period.id = $1::uuid
        AND period.status <> 'CLOSED'
        AND (
          (period.status = 'DRAFT' AND $2::competition_period_status IN (
            'SCHEDULED', 'ACTIVE', 'CLOSED'
          ))
          OR (period.status = 'SCHEDULED' AND $2::competition_period_status IN (
            'ACTIVE', 'PAUSED', 'CLOSED'
          ))
          OR (period.status = 'ACTIVE' AND $2::competition_period_status IN (
            'PAUSED', 'CLOSED'
          ))
          OR (period.status = 'PAUSED' AND $2::competition_period_status IN (
            'ACTIVE', 'CLOSED'
          ))
        )
        AND (
          $2::competition_period_status NOT IN ('ACTIVE', 'SCHEDULED')
          OR CURRENT_TIMESTAMP < period.ends_at
        )
        AND (
          $2::competition_period_status <> 'ACTIVE'
          OR NOT EXISTS (
            SELECT 1
            FROM competition_periods AS active_period
            WHERE
              active_period.id <> period.id
              AND active_period.status = 'ACTIVE'
          )
        )
      RETURNING
        id,
        name,
        status,
        starts_at,
        ends_at,
        paused_at,
        closed_at,
        created_at,
        updated_at
    """
    params: [$periodId, $status]
  )
}

# Operações administrativas chamadas exclusivamente pelas Functions. Além
# da callable, cada mutação confirma no banco o perfil TEACHER completo.
mutation CreateTeacherCompetitionPeriod(
  $periodId: UUID!
  $name: String!
  $startsAt: Timestamp!
  $endsAt: Timestamp!
  $status: CompetitionPeriodStatus!
  $actorUid: String!
) @auth(level: NO_ACCESS) {
  createdPeriod: _executeReturningFirst(
    sql: """
      INSERT INTO competition_periods (
        id, name, status, active_slot, starts_at, ends_at,
        created_at, updated_at
      )
      SELECT
        $1::uuid,
        BTRIM($2),
        $5::competition_period_status,
        NULL,
        $3,
        $4,
        CURRENT_TIMESTAMP,
        CURRENT_TIMESTAMP
      FROM users AS teacher
      WHERE
        teacher.firebase_uid = $6
        AND teacher.role = 'TEACHER'
        AND teacher.profile_completed = TRUE
        AND LENGTH(BTRIM($2)) BETWEEN 3 AND 80
        AND $3 < $4
        AND $5::competition_period_status IN ('DRAFT', 'SCHEDULED')
        AND NOT EXISTS (
          SELECT 1
          FROM competition_periods AS existing
          WHERE
            existing.status <> 'CLOSED'
            AND existing.starts_at < $4
            AND existing.ends_at > $3
        )
      RETURNING
        id,
        name,
        status::text AS "status",
        starts_at AS "startsAt",
        ends_at AS "endsAt",
        paused_at AS "pausedAt",
        closed_at AS "closedAt",
        created_at AS "createdAt",
        updated_at AS "updatedAt"
    """
    params: [$periodId, $name, $startsAt, $endsAt, $status, $actorUid]
  )
}

mutation UpdateTeacherCompetitionPeriod(
  $periodId: UUID!
  $name: String!
  $startsAt: Timestamp!
  $endsAt: Timestamp!
  $actorUid: String!
) @auth(level: NO_ACCESS) {
  updatedPeriod: _executeReturningFirst(
    sql: """
      UPDATE competition_periods AS period
      SET
        name = BTRIM($2),
        starts_at = $3,
        ends_at = $4,
        updated_at = CURRENT_TIMESTAMP
      WHERE
        period.id = $1::uuid
        AND period.status <> 'CLOSED'
        AND LENGTH(BTRIM($2)) BETWEEN 3 AND 80
        AND $3 < $4
        AND EXISTS (
          SELECT 1
          FROM users AS teacher
          WHERE
            teacher.firebase_uid = $5
            AND teacher.role = 'TEACHER'
            AND teacher.profile_completed = TRUE
        )
        AND NOT EXISTS (
          SELECT 1
          FROM competition_periods AS existing
          WHERE
            existing.id <> period.id
            AND existing.status <> 'CLOSED'
            AND existing.starts_at < $4
            AND existing.ends_at > $3
        )
        AND (
          period.status <> 'ACTIVE'
          OR ($3 <= CURRENT_TIMESTAMP AND CURRENT_TIMESTAMP < $4)
        )
        AND (
          period.status <> 'SCHEDULED'
          OR CURRENT_TIMESTAMP < $4
        )
      RETURNING
        id,
        name,
        status::text AS "status",
        starts_at AS "startsAt",
        ends_at AS "endsAt",
        paused_at AS "pausedAt",
        closed_at AS "closedAt",
        created_at AS "createdAt",
        updated_at AS "updatedAt"
    """
    params: [$periodId, $name, $startsAt, $endsAt, $actorUid]
  )
}

mutation SetTeacherCompetitionPeriodStatus(
  $periodId: UUID!
  $status: CompetitionPeriodStatus!
  $actorUid: String!
) @auth(level: NO_ACCESS) {
  updatedPeriod: _executeReturningFirst(
    sql: """
      WITH updated_period AS (
        UPDATE competition_periods AS period
        SET
          status = $2::competition_period_status,
          active_slot = CASE
            WHEN $2::competition_period_status = 'ACTIVE' THEN 'ACTIVE'
            ELSE NULL
          END,
          paused_at = CASE
            WHEN $2::competition_period_status = 'PAUSED'
              THEN CURRENT_TIMESTAMP
            WHEN $2::competition_period_status = 'ACTIVE'
              THEN NULL
            ELSE period.paused_at
          END,
          closed_at = CASE
            WHEN $2::competition_period_status = 'CLOSED'
              THEN CURRENT_TIMESTAMP
            ELSE period.closed_at
          END,
          updated_at = CURRENT_TIMESTAMP
        WHERE
          period.id = $1::uuid
          AND period.status <> 'CLOSED'
          AND EXISTS (
            SELECT 1
            FROM users AS teacher
            WHERE
              teacher.firebase_uid = $3
              AND teacher.role = 'TEACHER'
              AND teacher.profile_completed = TRUE
          )
          AND (
            (period.status = 'DRAFT' AND $2::competition_period_status IN (
              'SCHEDULED', 'ACTIVE', 'CLOSED'
            ))
            OR (period.status = 'SCHEDULED' AND $2::competition_period_status IN (
              'DRAFT', 'ACTIVE', 'PAUSED', 'CLOSED'
            ))
            OR (period.status = 'ACTIVE' AND $2::competition_period_status IN (
              'PAUSED', 'CLOSED'
            ))
            OR (period.status = 'PAUSED' AND $2::competition_period_status IN (
              'ACTIVE', 'CLOSED'
            ))
          )
          AND (
            $2::competition_period_status <> 'SCHEDULED'
            OR CURRENT_TIMESTAMP < period.ends_at
          )
          AND (
            $2::competition_period_status <> 'ACTIVE'
            OR (
              period.starts_at <= CURRENT_TIMESTAMP
              AND CURRENT_TIMESTAMP < period.ends_at
              AND NOT EXISTS (
                SELECT 1
                FROM competition_periods AS active_period
                WHERE
                  active_period.id <> period.id
                  AND active_period.status = 'ACTIVE'
              )
            )
          )
        RETURNING period.*
      ),
      compensations AS (
        INSERT INTO capi_coin_transactions (
          user_uid,
          amount,
          base_amount,
          streak_multiplier_percent,
          streak_bonus,
          transaction_type,
          reason,
          source_id,
          class_group,
          competition_period_id,
          competition_week,
          created_at
        )
        SELECT
          student.firebase_uid,
          -student.capi_coins,
          -student.capi_coins,
          100,
          0,
          'PERIOD_CLOSE_ADJUSTMENT'::capi_coin_transaction_type,
          'Compensação de encerramento do período',
          CONCAT('period-close:', period.id::text),
          student.class_group,
          period.id,
          (
            (CURRENT_TIMESTAMP AT TIME ZONE 'America/Fortaleza')::date
            - (
              EXTRACT(ISODOW FROM CURRENT_TIMESTAMP AT TIME ZONE 'America/Fortaleza')::integer - 1
            )
          )::date,
          CURRENT_TIMESTAMP
        FROM users AS student
        CROSS JOIN updated_period AS period
        WHERE
          $2::competition_period_status = 'CLOSED'
          AND student.capi_coins <> 0
        RETURNING user_uid
      ),
      zeroed_users AS (
        UPDATE users AS student
        SET
          capi_coins = 0,
          updated_at = CURRENT_TIMESTAMP
        FROM updated_period AS period
        WHERE
          $2::competition_period_status = 'CLOSED'
          AND student.capi_coins <> 0
        RETURNING student.firebase_uid
      )
      SELECT
        period.id,
        period.name,
        period.status::text AS "status",
        period.starts_at AS "startsAt",
        period.ends_at AS "endsAt",
        period.paused_at AS "pausedAt",
        period.closed_at AS "closedAt",
        period.created_at AS "createdAt",
        period.updated_at AS "updatedAt",
        (SELECT COUNT(*)::integer FROM compensations) AS "compensatedUsers",
        (SELECT COUNT(*)::integer FROM zeroed_users) AS "zeroedUsers"
      FROM updated_period AS period
    """
    params: [$periodId, $status, $actorUid]
  )
}

# Somente a callable function confiável pode preparar uma rodada. O gabarito
# fica no banco e nunca integra uma consulta autorizada ao navegador.
mutation CreateAuthoritativeActivitySession(
