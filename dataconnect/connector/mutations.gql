# Completa ou atualiza o perfil usando uma das Capis profissionais do catálogo.
mutation UpsertMyProfileWithAvatar(
  $preferredName: String!
  $classGroup: StudentClass!
  $avatarId: ProfessionalAvatar!
) @auth(level: USER_EMAIL_VERIFIED) {
  user_upsert(
    data: {
      uid_expr: "auth.uid"
      email_expr: "auth.token.email"
      preferredName: $preferredName
      classGroup: $classGroup
      avatarId: $avatarId
      avatarUrl: null
      profileCompleted: true
      updatedAt_expr: "request.time"
    }
  )
}

# Operações editoriais exclusivas do backend. As callables verificam o papel
# TEACHER e estas operações permanecem NO_ACCESS para o SDK do navegador.
mutation CreateLearningModuleVersionEditorial(
  $versionId: UUID!
  $moduleKey: String!
  $phaseNumber: Int!
  $version: Int!
  $status: EditorialStatus!
  $publicationKey: String
  $title: String!
  $changeSummary: String!
  $payload: Any!
  $actorUid: String!
  $publishedByUid: String
  $publishedAt: Timestamp
) @auth(level: NO_ACCESS) @transaction {
  learningModuleVersion_insert(
    data: {
      id: $versionId
      moduleKey: $moduleKey
      phaseNumber: $phaseNumber
      version: $version
      status: $status
      publicationKey: $publicationKey
      title: $title
      changeSummary: $changeSummary
      payload: $payload
      createdByUid: $actorUid
      publishedByUid: $publishedByUid
      publishedAt: $publishedAt
      createdAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
  editorialAuditLog_insert(
    data: {
      entityType: LEARNING_MODULE
      entityId: $versionId
      entityKey: $moduleKey
      version: $version
      action: "CREATED"
      actorUid: $actorUid
      summary: $changeSummary
      details: { initialStatus: $status }
      createdAt_expr: "request.time"
    }
  )
}

