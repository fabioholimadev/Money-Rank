mutation PublishLearningModuleVersionEditorial(
  $versionId: UUID!
  $actorUid: String!
) @auth(level: NO_ACCESS) {
  publishedCount: _execute(
    sql: """
      WITH teacher AS (
        SELECT firebase_uid
        FROM users
        WHERE firebase_uid = $2 AND role = 'TEACHER' AND profile_completed
      ),
      target AS (
        SELECT candidate.id, candidate.module_key, candidate.version
        FROM learning_module_versions AS candidate
        WHERE
          candidate.id = $1::uuid
          AND candidate.status = 'IN_REVIEW'
          AND EXISTS (SELECT 1 FROM teacher)
        FOR UPDATE
      ),
      archived AS (
        UPDATE learning_module_versions AS existing
        SET
          status = 'ARCHIVED', publication_key = NULL,
          updated_at = CURRENT_TIMESTAMP
        WHERE
          existing.module_key = (SELECT module_key FROM target)
          AND existing.status = 'PUBLISHED'
        RETURNING existing.id
      ),
      published AS (
        UPDATE learning_module_versions AS selected
        SET
          status = 'PUBLISHED',
          publication_key = selected.module_key,
          published_by_uid = $2,
          published_at = CURRENT_TIMESTAMP,
          updated_at = CURRENT_TIMESTAMP
        WHERE
          selected.id = (SELECT id FROM target)
          AND selected.status = 'IN_REVIEW'
          AND (SELECT COUNT(*) FROM archived) >= 0
        RETURNING selected.id, selected.module_key, selected.version,
          selected.status, selected.published_at
      )
      INSERT INTO editorial_audit_log (
        id, entity_type, entity_id, entity_key, version, action,
        actor_uid, summary, details, created_at
      )
      SELECT gen_random_uuid(), 'LEARNING_MODULE', id, module_key, version,
        'PUBLISHED', $2, 'Versão publicada',
        jsonb_build_object('archivedVersions', (SELECT COUNT(*) FROM archived)),
        CURRENT_TIMESTAMP
      FROM published
    """
    params: [$versionId, $actorUid]
  )
}

mutation PublishActivityDefinitionVersionEditorial(
  $versionId: UUID!
  $actorUid: String!
) @auth(level: NO_ACCESS) {
  publishedCount: _execute(
    sql: """
      WITH teacher AS (
        SELECT firebase_uid
        FROM users
        WHERE firebase_uid = $2 AND role = 'TEACHER' AND profile_completed
      ),
      target AS (
        SELECT candidate.id, candidate.activity_key, candidate.version
        FROM activity_definition_versions AS candidate
        WHERE
          candidate.id = $1::uuid
          AND candidate.status = 'IN_REVIEW'
          AND EXISTS (SELECT 1 FROM teacher)
          AND NOT EXISTS (
            SELECT 1
            FROM jsonb_array_elements(
              (CASE
                WHEN jsonb_typeof(candidate.payload->'knowledge') = 'array'
                  THEN candidate.payload->'knowledge'
                ELSE '[]'::jsonb
              END) ||
              (CASE
                WHEN jsonb_typeof(candidate.payload->'cards') = 'array'
                  THEN candidate.payload->'cards'
                ELSE '[]'::jsonb
              END)
            ) AS reviewed(item)
            WHERE
              reviewed.item ? 'review'
              AND (
                reviewed.item->'review'->>'pedagogical'
                  IS DISTINCT FROM 'teacher_approved'
                OR reviewed.item->'review'->>'technical'
                  NOT IN ('source_verified', 'project_created')
                OR (
                  reviewed.item->'review'->>'technical' = 'source_verified'
                  AND NOT EXISTS (
                    SELECT 1
                    FROM research_reviews AS approval
                    WHERE
                      approval.activity_key = candidate.activity_key
                      AND approval.fact_key = reviewed.item->>'id'
                      AND approval.status = 'TEACHER_APPROVED'
                      AND approval.reviewed_by_uid IS NOT NULL
                      AND approval.reviewed_at IS NOT NULL
                      AND approval.source_url = COALESCE(
                        reviewed.item->'source'->>'url',
                        reviewed.item->'evidence'->>'url'
                      )
                      AND (
                        reviewed.item->>'claim' IS NULL
                        OR approval.claim = reviewed.item->>'claim'
                      )
                  )
                )
              )
          )
        FOR UPDATE
      ),
      archived AS (
        UPDATE activity_definition_versions AS existing
        SET
          status = 'ARCHIVED', publication_key = NULL,
          updated_at = CURRENT_TIMESTAMP
        WHERE
          existing.activity_key = (SELECT activity_key FROM target)
          AND existing.status = 'PUBLISHED'
        RETURNING existing.id
      ),
      published AS (
        UPDATE activity_definition_versions AS selected
        SET
          status = 'PUBLISHED',
          publication_key = selected.activity_key,
          published_by_uid = $2,
          published_at = CURRENT_TIMESTAMP,
          updated_at = CURRENT_TIMESTAMP
        WHERE
          selected.id = (SELECT id FROM target)
          AND selected.status = 'IN_REVIEW'
          AND (SELECT COUNT(*) FROM archived) >= 0
        RETURNING selected.id, selected.activity_key, selected.version,
          selected.status, selected.published_at
      )
      INSERT INTO editorial_audit_log (
        id, entity_type, entity_id, entity_key, version, action,
        actor_uid, summary, details, created_at
      )
      SELECT gen_random_uuid(), 'ACTIVITY_DEFINITION', id, activity_key,
        version, 'PUBLISHED', $2, 'Versão publicada',
        jsonb_build_object('archivedVersions', (SELECT COUNT(*) FROM archived)),
        CURRENT_TIMESTAMP
      FROM published
    """
    params: [$versionId, $actorUid]
  )
}

mutation CreateResearchReviewEditorial(
  $reviewId: UUID!
  $activityKey: String!
  $factKey: String!
  $title: String!
  $claim: String!
  $sourceUrl: String!
  $proposedBy: String!
  $actorUid: String!
) @auth(level: NO_ACCESS) @transaction {
  researchReview_insert(
    data: {
      id: $reviewId
      activityKey: $activityKey
      factKey: $factKey
      title: $title
      claim: $claim
      sourceUrl: $sourceUrl
      proposedBy: $proposedBy
      status: PENDING_TEACHER_REVIEW
      createdByUid: $actorUid
      createdAt_expr: "request.time"
      updatedAt_expr: "request.time"
    }
  )
  editorialAuditLog_insert(
    data: {
      entityType: RESEARCH_REVIEW
      entityId: $reviewId
      entityKey: $factKey
