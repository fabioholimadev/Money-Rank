mutation ReviewResearchEditorial(
  $reviewId: UUID!
  $status: ResearchReviewStatus!
  $reviewNotes: String
  $actorUid: String!
) @auth(level: NO_ACCESS) {
  reviewedCount: _execute(
    sql: """
      WITH teacher AS (
        SELECT firebase_uid FROM users
        WHERE firebase_uid = $4 AND role = 'TEACHER' AND profile_completed
      ),
      reviewed AS (
        UPDATE research_reviews
        SET
          status = $2::research_review_status,
          review_notes = NULLIF(BTRIM($3), ''),
          reviewed_by_uid = $4,
          reviewed_at = CURRENT_TIMESTAMP,
          updated_at = CURRENT_TIMESTAMP
        WHERE
          id = $1::uuid
          AND status = 'PENDING_TEACHER_REVIEW'
          AND $2::research_review_status IN ('TEACHER_APPROVED', 'REJECTED')
          AND EXISTS (SELECT 1 FROM teacher)
        RETURNING id, fact_key, status
      )
      INSERT INTO editorial_audit_log (
        id, entity_type, entity_id, entity_key, version, action,
        actor_uid, summary, created_at
      )
      SELECT gen_random_uuid(), 'RESEARCH_REVIEW', id, fact_key, 1,
        CASE WHEN status = 'TEACHER_APPROVED' THEN 'APPROVED' ELSE 'REJECTED' END,
        $4, COALESCE(NULLIF(BTRIM($3), ''), 'Revisão pedagógica'),
        CURRENT_TIMESTAMP
      FROM reviewed
    """
    params: [$reviewId, $status, $reviewNotes, $actorUid]
  )
}

# Registra somente metadados de um arquivo que já foi validado e gravado no
# Firebase Storage pela Function. A checagem de professor e de versão DRAFT é
# repetida no banco para impedir associação administrativa indevida.
mutation CreateContentAssetEditorial(
  $assetId: UUID!
  $entityType: EditorialEntityType!
  $entityId: UUID!
  $assetType: ContentAssetType!
  $displayName: String!
  $url: String!
  $storagePath: String!
  $mimeType: String!
  $sizeBytes: Int64!
  $sha256: String!
  $actorUid: String!
) @auth(level: NO_ACCESS) {
  createdAsset: _executeReturningFirst(
    sql: """
      INSERT INTO content_assets (
        id, entity_type, entity_id, asset_type, display_name, url,
        storage_path, mime_type, size_bytes, sha256, created_by_uid, created_at
      )
      SELECT
        $1::uuid, $2::editorial_entity_type, $3::uuid,
        $4::content_asset_type, BTRIM($5), $6, $7, $8, $9::bigint,
        LOWER($10), $11, CURRENT_TIMESTAMP
      FROM users AS teacher
      WHERE
        teacher.firebase_uid = $11
        AND teacher.role = 'TEACHER'
        AND teacher.profile_completed = TRUE
        AND (
          (
            $2::editorial_entity_type = 'LEARNING_MODULE'
            AND EXISTS (
              SELECT 1 FROM learning_module_versions AS version
              WHERE version.id = $3::uuid AND version.status = 'DRAFT'
            )
          )
          OR (
            $2::editorial_entity_type = 'ACTIVITY_DEFINITION'
            AND EXISTS (
              SELECT 1 FROM activity_definition_versions AS version
              WHERE version.id = $3::uuid AND version.status = 'DRAFT'
            )
          )
        )
      RETURNING
        id, entity_type AS "entityType", entity_id AS "entityId",
        asset_type AS "assetType", display_name AS "displayName", url,
        storage_path AS "storagePath", mime_type AS "mimeType",
        size_bytes AS "sizeBytes", sha256, created_at AS "createdAt"
    """
    params: [
      $assetId
      $entityType
      $entityId
      $assetType
      $displayName
      $url
      $storagePath
      $mimeType
      $sizeBytes
      $sha256
      $actorUid
    ]
  )
}

