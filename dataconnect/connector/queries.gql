# Consulta operacional exclusiva do backend administrativo. Ela identifica
# rajadas de aprovações por aluno/hora sem impor teto diário de recompensas.
query GetCompetitionAbuseSignals(
  $periodId: UUID!
  $minimumApprovedAttempts: Int = 20
) @auth(level: NO_ACCESS) {
  signals: _select(
    sql: """
      SELECT
        attempts.user_uid,
        DATE_TRUNC('hour', attempts.created_at) AS hour_bucket,
        COUNT(*)::integer AS approved_attempts,
        COALESCE(SUM(attempts.reward_amount), 0)::integer AS reward_amount
      FROM activity_attempts AS attempts
      INNER JOIN capi_coin_transactions AS transactions
        ON transactions.attempt_id = attempts.id
      WHERE
        transactions.competition_period_id = $1
        AND transactions.is_test = FALSE
        AND attempts.is_test = FALSE
        AND attempts.passed = TRUE
      GROUP BY
        attempts.user_uid,
        DATE_TRUNC('hour', attempts.created_at)
      HAVING COUNT(*) >= $2
      ORDER BY approved_attempts DESC, hour_bucket DESC
    """
    params: [$periodId, $minimumApprovedAttempts]
  )
}

# Períodos visíveis apenas para um professor autenticado no Capi Bank. O
# navegador não informa o UID nem consegue substituir o papel persistido.
query ListTeacherCompetitionPeriods($limit: Int = 20)
  @auth(level: USER_EMAIL_VERIFIED) {
  periods: _select(
    sql: """
      WITH authorized_teacher AS (
        SELECT 1
        FROM users AS teacher
        WHERE
          teacher.firebase_uid = $1
          AND teacher.role = 'TEACHER'
          AND teacher.profile_completed = TRUE
        LIMIT 1
      )
      SELECT
        period.id,
        period.name,
        period.period_key AS "periodKey",
        period.time_zone AS "timeZone",
        period.schedule,
        period.status::text AS "status",
        period.starts_at AS "startsAt",
        period.ends_at AS "endsAt",
        period.paused_at AS "pausedAt",
        period.closed_at AS "closedAt"
      FROM competition_periods AS period
      CROSS JOIN authorized_teacher
      ORDER BY period.starts_at DESC
      LIMIT LEAST(GREATEST($2, 1), 50)
    """
    params: [{ _expr: "auth.uid" }, $limit]
  )
}

# Painel agregado da Task 5.2. Cada raiz repete a autorização no banco porque
# esconder a rota no React não protege os dados coletivos dos estudantes.
query GetTeacherDashboard(
  $periodId: UUID!
  $studentLimit: Int = 100
) @auth(level: USER_EMAIL_VERIFIED) {
  summary: _selectFirst(
    sql: """
      WITH authorized_teacher AS (
        SELECT 1
        FROM users AS teacher
        WHERE
          teacher.firebase_uid = $2
          AND teacher.role = 'TEACHER'
          AND teacher.profile_completed = TRUE
        LIMIT 1
      ),
      target_period AS (
        SELECT period.id, period.starts_at, period.ends_at
        FROM competition_periods AS period
        CROSS JOIN authorized_teacher
        WHERE period.id = $1::uuid
      ),
      students AS (
        SELECT student.firebase_uid
        FROM users AS student
        CROSS JOIN target_period
        WHERE
          student.role = 'STUDENT'
          AND student.profile_completed = TRUE
          AND student.class_group IN ('THIRD_DSA', 'THIRD_DSB')
      ),
      period_attempts AS (
        SELECT attempt.*
        FROM activity_attempts AS attempt
        INNER JOIN students ON students.firebase_uid = attempt.user_uid
        CROSS JOIN target_period AS period
        WHERE
          attempt.created_at >= period.starts_at
          AND attempt.created_at < period.ends_at
          AND attempt.is_test = FALSE
      ),
      period_transactions AS (
        SELECT transaction.user_uid, transaction.amount
        FROM capi_coin_transactions AS transaction
        INNER JOIN students ON students.firebase_uid = transaction.user_uid
        CROSS JOIN target_period AS period
        WHERE
          transaction.competition_period_id = period.id
          AND transaction.amount > 0
          AND transaction.is_test = FALSE
      ),
      participants AS (
        SELECT user_uid FROM period_attempts
        UNION
        SELECT user_uid FROM period_transactions
      )
      SELECT
        COUNT(DISTINCT students.firebase_uid)::integer AS "totalStudents",
        COUNT(DISTINCT participants.user_uid)::integer
          AS "participatingStudents",
        COALESCE((SELECT SUM(amount) FROM period_transactions), 0)::integer
          AS "totalPoints",
        (SELECT COUNT(*) FROM period_attempts)::integer AS "totalAttempts",
        (SELECT COUNT(*) FROM period_attempts WHERE passed = TRUE)::integer
          AS "approvedAttempts",
        COALESCE((SELECT ROUND(AVG(score)) FROM period_attempts), 0)::integer
          AS "averageScore",
        COUNT(DISTINCT students.firebase_uid) FILTER (
          WHERE EXISTS (
            SELECT 1
            FROM student_progress AS progress
            WHERE
              progress.user_uid = students.firebase_uid
              AND progress.phase_number = 4
              AND progress.status = 'COMPLETED'
          )
        )::integer AS "completedTrailStudents"
      FROM students
      LEFT JOIN participants
        ON participants.user_uid = students.firebase_uid
    """
    params: [$periodId, { _expr: "auth.uid" }]
  )
  classMetrics: _select(
    sql: """
      WITH authorized_teacher AS (
        SELECT 1
        FROM users AS teacher
        WHERE
          teacher.firebase_uid = $2
          AND teacher.role = 'TEACHER'
          AND teacher.profile_completed = TRUE
        LIMIT 1
      ),
      target_period AS (
        SELECT period.id, period.starts_at, period.ends_at
        FROM competition_periods AS period
        CROSS JOIN authorized_teacher
        WHERE period.id = $1::uuid
      ),
      students AS (
        SELECT student.firebase_uid, student.class_group
        FROM users AS student
        CROSS JOIN target_period
        WHERE
          student.role = 'STUDENT'
          AND student.profile_completed = TRUE
          AND student.class_group IN ('THIRD_DSA', 'THIRD_DSB')
      ),
      period_attempts AS (
        SELECT attempt.*
        FROM activity_attempts AS attempt
        INNER JOIN students ON students.firebase_uid = attempt.user_uid
        CROSS JOIN target_period AS period
        WHERE
          attempt.created_at >= period.starts_at
          AND attempt.created_at < period.ends_at
          AND attempt.is_test = FALSE
      ),
      period_transactions AS (
        SELECT transaction.user_uid, transaction.amount
        FROM capi_coin_transactions AS transaction
        INNER JOIN students ON students.firebase_uid = transaction.user_uid
        CROSS JOIN target_period AS period
        WHERE
          transaction.competition_period_id = period.id
          AND transaction.amount > 0
          AND transaction.is_test = FALSE
      ),
      participants AS (
        SELECT user_uid FROM period_attempts
        UNION
        SELECT user_uid FROM period_transactions
      ),
      attempt_totals AS (
        SELECT
          user_uid,
          COUNT(*)::integer AS attempts,
          ROUND(AVG(score))::integer AS average_score
        FROM period_attempts
        GROUP BY user_uid
      ),
      point_totals AS (
        SELECT user_uid, SUM(amount)::integer AS points
        FROM period_transactions
        GROUP BY user_uid
      ),
      progress_totals AS (
        SELECT
          progress.user_uid,
          COUNT(*) FILTER (
            WHERE
              progress.phase_number BETWEEN 0 AND 4
              AND progress.status = 'COMPLETED'
          )::integer AS completed_steps
        FROM student_progress AS progress
        INNER JOIN students ON students.firebase_uid = progress.user_uid
        GROUP BY progress.user_uid
      )
      SELECT
        students.class_group::text AS "classGroup",
        COUNT(*)::integer AS "registeredStudents",
        COUNT(*) FILTER (
          WHERE participants.user_uid IS NOT NULL
        )::integer AS "participatingStudents",
        COALESCE(SUM(point_totals.points), 0)::integer AS "totalPoints",
        COALESCE(SUM(attempt_totals.attempts), 0)::integer
          AS "totalAttempts",
        COALESCE(ROUND(AVG(attempt_totals.average_score)), 0)::integer
          AS "averageScore",
        COALESCE(
          ROUND(AVG(COALESCE(progress_totals.completed_steps, 0)) * 20),
          0
        )::integer AS "progressPercent"
      FROM students
      LEFT JOIN participants
        ON participants.user_uid = students.firebase_uid
      LEFT JOIN attempt_totals
        ON attempt_totals.user_uid = students.firebase_uid
      LEFT JOIN point_totals
        ON point_totals.user_uid = students.firebase_uid
      LEFT JOIN progress_totals
        ON progress_totals.user_uid = students.firebase_uid
      GROUP BY students.class_group
      ORDER BY students.class_group ASC
    """
    params: [$periodId, { _expr: "auth.uid" }]
  )
  phaseMetrics: _select(
    sql: """
      WITH authorized_teacher AS (
        SELECT 1
        FROM users AS teacher
        WHERE
          teacher.firebase_uid = $2
          AND teacher.role = 'TEACHER'
          AND teacher.profile_completed = TRUE
        LIMIT 1
      ),
      target_period AS (
        SELECT period.starts_at, period.ends_at
        FROM competition_periods AS period
        CROSS JOIN authorized_teacher
        WHERE period.id = $1::uuid
      ),
      students AS (
        SELECT student.firebase_uid
        FROM users AS student
        CROSS JOIN target_period
        WHERE
          student.role = 'STUDENT'
          AND student.profile_completed = TRUE
          AND student.class_group IN ('THIRD_DSA', 'THIRD_DSB')
      ),
      phases AS (
        SELECT GENERATE_SERIES(1, 4)::integer AS phase_number
      ),
      attempts AS (
        SELECT attempt.*
        FROM activity_attempts AS attempt
        INNER JOIN students ON students.firebase_uid = attempt.user_uid
        CROSS JOIN target_period AS period
        WHERE
          attempt.created_at >= period.starts_at
          AND attempt.created_at < period.ends_at
          AND attempt.is_test = FALSE
      ),
      attempt_totals AS (
        SELECT
          phase_number,
          COUNT(*)::integer AS total_attempts,
          COUNT(*) FILTER (WHERE passed = TRUE)::integer
            AS approved_attempts,
          ROUND(AVG(score))::integer AS average_score,
          SUM(correct_answers)::integer AS correct_answers,
          SUM(wrong_answers)::integer AS wrong_answers
        FROM attempts
        GROUP BY phase_number
      ),
      progress_totals AS (
        SELECT
          progress.phase_number,
          COUNT(*) FILTER (
            WHERE progress.status IN ('IN_PROGRESS', 'COMPLETED')
          )::integer AS students_reached,
          COUNT(*) FILTER (
            WHERE progress.status = 'COMPLETED'
          )::integer AS students_completed
        FROM student_progress AS progress
        INNER JOIN students ON students.firebase_uid = progress.user_uid
        WHERE progress.phase_number BETWEEN 1 AND 4
        GROUP BY progress.phase_number
      )
      SELECT
        phases.phase_number AS "phaseNumber",
        COALESCE(progress_totals.students_reached, 0)::integer
          AS "studentsReached",
        COALESCE(progress_totals.students_completed, 0)::integer
          AS "studentsCompleted",
        COALESCE(attempt_totals.total_attempts, 0)::integer
          AS "totalAttempts",
        COALESCE(attempt_totals.approved_attempts, 0)::integer
          AS "approvedAttempts",
        COALESCE(attempt_totals.average_score, 0)::integer
          AS "averageScore",
        COALESCE(attempt_totals.correct_answers, 0)::integer
          AS "correctAnswers",
        COALESCE(attempt_totals.wrong_answers, 0)::integer
          AS "wrongAnswers"
      FROM phases
      LEFT JOIN attempt_totals
        ON attempt_totals.phase_number = phases.phase_number
      LEFT JOIN progress_totals
        ON progress_totals.phase_number = phases.phase_number
      ORDER BY phases.phase_number ASC
    """
    params: [$periodId, { _expr: "auth.uid" }]
  )
  studentMetrics: _select(
    sql: """
      WITH authorized_teacher AS (
        SELECT 1
        FROM users AS teacher
        WHERE
          teacher.firebase_uid = $2
          AND teacher.role = 'TEACHER'
          AND teacher.profile_completed = TRUE
        LIMIT 1
      ),
      target_period AS (
        SELECT period.id, period.starts_at, period.ends_at
        FROM competition_periods AS period
        CROSS JOIN authorized_teacher
        WHERE period.id = $1::uuid
      ),
      students AS (
        SELECT
          student.firebase_uid,
          student.preferred_name,
          student.class_group,
          student.current_phase,
          student.capi_coins
        FROM users AS student
        CROSS JOIN target_period
        WHERE
          student.role = 'STUDENT'
          AND student.profile_completed = TRUE
          AND student.class_group IN ('THIRD_DSA', 'THIRD_DSB')
      ),
      attempt_totals AS (
        SELECT
          attempt.user_uid,
          COUNT(*)::integer AS attempts,
          ROUND(AVG(attempt.score))::integer AS average_score,
          SUM(attempt.wrong_answers)::integer AS wrong_answers,
          MAX(attempt.created_at) AS last_activity_at
        FROM activity_attempts AS attempt
        INNER JOIN students ON students.firebase_uid = attempt.user_uid
        CROSS JOIN target_period AS period
        WHERE
          attempt.created_at >= period.starts_at
          AND attempt.created_at < period.ends_at
          AND attempt.is_test = FALSE
        GROUP BY attempt.user_uid
      ),
      point_totals AS (
        SELECT
          transaction.user_uid,
          SUM(transaction.amount)::integer AS points
        FROM capi_coin_transactions AS transaction
        INNER JOIN students ON students.firebase_uid = transaction.user_uid
        CROSS JOIN target_period AS period
        WHERE
          transaction.competition_period_id = period.id
          AND transaction.amount > 0
          AND transaction.is_test = FALSE
        GROUP BY transaction.user_uid
      ),
      progress_totals AS (
        SELECT
          progress.user_uid,
          COUNT(*) FILTER (
            WHERE
              progress.phase_number BETWEEN 0 AND 4
              AND progress.status = 'COMPLETED'
          )::integer AS completed_steps
        FROM student_progress AS progress
        INNER JOIN students ON students.firebase_uid = progress.user_uid
        GROUP BY progress.user_uid
      )
      SELECT
        students.preferred_name AS "preferredName",
        students.class_group::text AS "classGroup",
        students.current_phase AS "currentPhase",
        students.capi_coins AS "capiCoins",
        COALESCE(progress_totals.completed_steps, 0)::integer
          AS "completedSteps",
        COALESCE(attempt_totals.attempts, 0)::integer AS "totalAttempts",
        COALESCE(attempt_totals.average_score, 0)::integer
          AS "averageScore",
        COALESCE(attempt_totals.wrong_answers, 0)::integer AS "wrongAnswers",
        COALESCE(point_totals.points, 0)::integer AS "totalPoints",
        attempt_totals.last_activity_at AS "lastActivityAt"
      FROM students
      LEFT JOIN attempt_totals
        ON attempt_totals.user_uid = students.firebase_uid
      LEFT JOIN point_totals
        ON point_totals.user_uid = students.firebase_uid
      LEFT JOIN progress_totals
        ON progress_totals.user_uid = students.firebase_uid
      ORDER BY students.class_group ASC, students.preferred_name ASC
      LIMIT LEAST(GREATEST($3, 1), 100)
    """
    params: [$periodId, { _expr: "auth.uid" }, $studentLimit]
  )
}

query GetPedagogicalBankStatus @auth(level: NO_ACCESS) {
  latestLoad: _selectFirst(
    sql: """
      SELECT
        load_hash AS "loadHash",
        load_version AS "loadVersion",
        source_file AS "sourceFile",
        item_count AS "itemCount",
        inserted_count AS "insertedCount",
        updated_count AS "updatedCount",
        ignored_count AS "ignoredCount",
        rejected_count AS "rejectedCount",
        imported_at AS "importedAt"
      FROM pedagogical_bank_loads
      ORDER BY imported_at DESC
      LIMIT 1
    """
  )
  counts: _select(
    sql: """
      SELECT
        activity_id AS "activityId",
        COUNT(*)::integer AS "totalItems",
        COUNT(*) FILTER (WHERE active = TRUE)::integer AS "activeItems"
      FROM pedagogical_items
      GROUP BY activity_id
      ORDER BY activity_id
    """
  )
  items: _select(
    sql: """
      SELECT
        activity_id AS "activityId",
        version,
        item_id AS "itemId",
        content_hash AS "contentHash"
      FROM pedagogical_items
      ORDER BY activity_id, version, item_id
    """
  )
}

query ListActivePedagogicalItemsForActivity($activityId: String!)
  @auth(level: NO_ACCESS) {
  pedagogicalItems(
    where: {
      activityId: { eq: $activityId }
      active: { eq: true }
    }
    orderBy: [{ difficulty: ASC }, { itemId: ASC }]
  ) {
    activityId
    version
    itemId
    phaseNumber
    itemType
    characterId
    difficulty
    stage
    pathCondition
    publicPayload
    secretPayload
    sourceId
    sourceUrl
    tags
    active
    reviewStatus
    origin
    contentHash
    loadHash
  }
}

query ListStudentSeenPedagogicalItemIds(
  $studentUid: String!
  $activityId: String!
) @auth(level: NO_ACCESS) {
  seenItems: _select(
    sql: """
      SELECT DISTINCT item->>'itemId' AS "itemId"
      FROM activity_sessions AS session
      CROSS JOIN LATERAL jsonb_array_elements(
        COALESCE(session.answer_key->'items', '[]'::jsonb)
      ) AS item
      WHERE session.user_uid = $1
        AND session.activity_id = $2
        AND session.status = 'SUBMITTED'
        AND item ? 'itemId'
      ORDER BY "itemId"
    """
    params: [$studentUid, $activityId]
  )
}

query GetPilotClassBinding($studentUid: String!) @auth(level: NO_ACCESS) {
  user(first: { where: { uid: { eq: $studentUid } } }) {
    uid
    role
    classGroup
    profileCompleted
    capiCoins
    currentPhase
    currentStreak
  }
}

query ResolveCompetitionPeriodByKey($periodKey: String!)
  @auth(level: NO_ACCESS) {
  competitionPeriod(first: { where: { periodKey: { eq: $periodKey } } }) {
    id
    periodKey
    name
    timeZone
    schedule
    status
    startsAt
    endsAt
  }
}

# Concessão de teste autoritativa. A conta precisa continuar registrada como
# TEACHER no banco e a execução precisa estar dentro do prazo do servidor.
query GetActiveTestRunForUser($userUid: String!) @auth(level: NO_ACCESS) {
  testRun: _selectFirst(
    sql: """
      SELECT
        run.id,
        run.created_by_uid AS "createdByUid",
        run.status::text AS "status",
        run.duration_minutes AS "durationMinutes",
        run.starts_at AS "startsAt",
        run.ends_at AS "endsAt",
        run.ended_at AS "endedAt",
        run.cleaned_at AS "cleanedAt",
        run.created_at AS "createdAt",
        run.updated_at AS "updatedAt"
      FROM test_runs AS run
      INNER JOIN users AS teacher
        ON teacher.firebase_uid = run.created_by_uid
      WHERE
        run.created_by_uid = $1
        AND teacher.role = 'TEACHER'
        AND teacher.profile_completed = TRUE
        AND run.status = 'ACTIVE'
        AND run.starts_at <= CURRENT_TIMESTAMP
        AND run.ends_at > CURRENT_TIMESTAMP
      ORDER BY run.created_at DESC
      LIMIT 1
    """
    params: [$userUid]
  )
}

query GetTeacherTestRun($actorUid: String!) @auth(level: NO_ACCESS) {
  testRun: _selectFirst(
    sql: """
      SELECT
        run.id,
        run.created_by_uid AS "createdByUid",
        CASE
          WHEN run.status = 'ACTIVE' AND run.ends_at <= CURRENT_TIMESTAMP
            THEN 'EXPIRED'
          ELSE run.status::text
        END AS "status",
        run.duration_minutes AS "durationMinutes",
        run.starts_at AS "startsAt",
        run.ends_at AS "endsAt",
        run.ended_at AS "endedAt",
        run.cleaned_at AS "cleanedAt",
        run.created_at AS "createdAt",
        run.updated_at AS "updatedAt",
        (
          SELECT COUNT(*)::integer
          FROM activity_sessions AS session
          WHERE session.test_run_id = run.id AND session.is_test = TRUE
        ) AS "sessionCount",
        (
          SELECT COUNT(*)::integer
          FROM activity_attempts AS attempt
          WHERE attempt.test_run_id = run.id AND attempt.is_test = TRUE
        ) AS "attemptCount",
        (
          SELECT COUNT(*)::integer
          FROM test_run_audit AS audit
          WHERE audit.test_run_id = run.id
        ) AS "auditCount",
        (
          SELECT audit.action::text
          FROM test_run_audit AS audit
          WHERE audit.test_run_id = run.id
          ORDER BY audit.created_at DESC
          LIMIT 1
        ) AS "latestAuditAction"
      FROM test_runs AS run
      INNER JOIN users AS teacher
        ON teacher.firebase_uid = run.created_by_uid
      WHERE
        run.created_by_uid = $1
        AND teacher.role = 'TEACHER'
        AND teacher.profile_completed = TRUE
      ORDER BY run.created_at DESC
      LIMIT 1
    """
    params: [$actorUid]
  )
}

query GetPilotExportRows($periodId: UUID!) @auth(level: NO_ACCESS) {
  attempts: _select(
    sql: """
      SELECT
        attempt.id::text AS "attemptId",
        attempt.user_uid AS "studentUid",
        CASE users.class_group::text
          WHEN 'THIRD_DSA' THEN '3DSA'
          WHEN 'THIRD_DSB' THEN '3DSB'
          ELSE NULL
        END AS "classId",
        attempt.activity_id AS "activityId",
        attempt.phase_number AS "phaseNumber",
        attempt.score,
        attempt.passed,
        attempt.first_completion AS "firstCompletion",
        attempt.reward_amount AS "rewardAmount",
        attempt.created_at AS "createdAt"
      FROM activity_attempts AS attempt
      INNER JOIN users ON users.firebase_uid = attempt.user_uid
      INNER JOIN competition_periods AS period ON period.id = $1::uuid
      WHERE attempt.created_at >= period.starts_at
        AND attempt.created_at < period.ends_at
        AND attempt.is_test = FALSE
      ORDER BY attempt.created_at ASC
    """
    params: [$periodId]
  )
  transactions: _select(
    sql: """
      SELECT
        transaction.id::text AS "transactionId",
        transaction.user_uid AS "studentUid",
        CASE transaction.class_group::text
          WHEN 'THIRD_DSA' THEN '3DSA'
          WHEN 'THIRD_DSB' THEN '3DSB'
          ELSE NULL
        END AS "classId",
        transaction.transaction_type::text AS "transactionType",
        transaction.amount,
        transaction.base_amount AS "baseAmount",
        transaction.reason,
        transaction.source_id AS "sourceId",
        transaction.phase_number AS "phaseNumber",
        transaction.created_at AS "createdAt"
      FROM capi_coin_transactions AS transaction
      WHERE transaction.competition_period_id = $1::uuid
        AND transaction.is_test = FALSE
      ORDER BY transaction.created_at ASC
    """
    params: [$periodId]
  )
  audit: _select(
    sql: """
      SELECT
        'PEDAGOGICAL_BANK_LOAD' AS "eventType",
        load_hash AS "eventId",
        imported_at AS "occurredAt",
        jsonb_build_object(
          'sourceFile', source_file,
          'itemCount', item_count,
          'inserted', inserted_count,
          'updated', updated_count,
          'ignored', ignored_count,
          'rejected', rejected_count
        ) AS details
      FROM pedagogical_bank_loads
      UNION ALL
      SELECT
        'COMPETITION_PERIOD' AS "eventType",
        period.id::text AS "eventId",
        period.updated_at AS "occurredAt",
        jsonb_build_object(
          'periodKey', period.period_key,
          'status', period.status::text,
          'startsAt', period.starts_at,
          'endsAt', period.ends_at,
          'timeZone', period.time_zone
        ) AS details
      FROM competition_periods AS period
      WHERE period.id = $1::uuid
      ORDER BY "occurredAt" ASC
    """
    params: [$periodId]
  )
}

query GetLoadTestCleanupStatus($runId: String!) @auth(level: NO_ACCESS) {
  run: loadTestRun(first: { where: { runId: { eq: $runId } } }) {
    runId
    status
    requestedUsers
    createdUsers
    deletedDatabaseUsers
    deletedAuthUsers
    metrics
    startedAt
    completedAt
    cleanedAt
  }
  remainingMarkedUsers: _selectFirst(
    sql: """
      SELECT COUNT(*)::integer AS count
      FROM users
      WHERE is_test = TRUE
        AND origin = 'LOAD_TEST'
        AND firebase_uid LIKE 'loadtest-%'
    """
  )
}
