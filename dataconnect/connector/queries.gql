# Histórico paginado de tentativas do aluno. Será usado nas atividades e,
# futuramente, nos relatórios pedagógicos.
query ListMyActivityAttempts($phaseNumber: Int!, $offset: Int = 0)
  @auth(level: USER_EMAIL_VERIFIED) {
  activityAttempts(
    where: {
      userUid: { eq_expr: "auth.uid" }
      phaseNumber: { eq: $phaseNumber }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 50
    offset: $offset
  ) {
    id
    activityId
    phaseNumber
    score
    correctAnswers
    wrongAnswers
    passed
    firstCompletion
    rewardBase
    streakMultiplierPercent
    streakBonus
    rewardAmount
    rewardLimitReached
    rewardSuppressionReason
    createdAt
  }
}

# A configuração pode ser consultada pelo app, mas somente uma rotina
