# Retorna apenas o perfil associado ao token Firebase Auth atual.
query GetMyProfile @auth(level: USER_EMAIL_VERIFIED) {
  user(key: { uid_expr: "auth.uid" }) {
    uid
    email
    preferredName
    classGroup
    role
    avatarId
    avatarUrl
    profileCompleted
    capiCoins
    currentPhase
    currentStreak
    lastStreakDate
    createdAt
    updatedAt
  }
}

# O uid não é recebido do cliente: o filtro sempre usa auth.uid.
query ListMyProgress @auth(level: USER_EMAIL_VERIFIED) {
  studentProgressEntries(
    where: { userUid: { eq_expr: "auth.uid" } }
    orderBy: [{ phaseNumber: ASC }]
  ) {
    phaseNumber
    status
    score
    attempts
    correctAnswers
    wrongAnswers
    startedAt
    completedAt
    updatedAt
  }
}

# Histórico paginado, ordenado do lançamento mais recente para o mais antigo.
query ListMyCapiCoinTransactions($offset: Int = 0)
  @auth(level: USER_EMAIL_VERIFIED) {
  capiCoinTransactions(
    where: { userUid: { eq_expr: "auth.uid" } }
    orderBy: [{ createdAt: DESC }]
    limit: 50
    offset: $offset
  ) {
    id
    attemptId
    amount
    baseAmount
    streakMultiplierPercent
    streakBonus
    transactionType
    reason
    sourceId
    phaseNumber
    classGroup
    competitionPeriodId
    competitionWeek
    createdAt
  }
}

# Retorna o lançamento de uma etapa única, como o Passo 0 ou o conteúdo de
# uma fase. Assim, o frontend exibe o valor real já multiplicado pelo streak.
query GetMyCapiCoinTransactionBySource($sourceId: String!)
  @auth(level: USER_EMAIL_VERIFIED) {
  capiCoinTransactions(
    where: {
      userUid: { eq_expr: "auth.uid" }
      sourceId: { eq: $sourceId }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 1
  ) {
    id
    amount
    baseAmount
    streakMultiplierPercent
    streakBonus
    transactionType
    sourceId
    phaseNumber
    competitionPeriodId
    createdAt
  }
}

# Recupera o resultado autoritativo de uma tentativa pelo identificador de
# idempotência. O filtro por auth.uid impede a leitura de tentativas de outro
# aluno, mesmo que o UUID seja conhecido.
query GetMyActivityAttempt($attemptId: UUID!)
  @auth(level: USER_EMAIL_VERIFIED) {
  activityAttempts(
    where: {
      id: { eq: $attemptId }
      userUid: { eq_expr: "auth.uid" }
    }
    limit: 1
  ) {
    id
    activityId
    phaseNumber
    score
    correctAnswers
    wrongAnswers
    passed
    firstCompletion
    rewardBase
    streakMultiplierPercent
    streakBonus
    rewardAmount
    rewardLimitReached
    rewardSuppressionReason
    createdAt
  }
}

# As duas consultas abaixo contêm gabarito e resultados coletivos da operação
# confiável. Somente Firebase Admin SDK pode executá-las.
query GetAuthoritativeActivitySession($sessionId: UUID!)
  @auth(level: NO_ACCESS) {
  activitySession(id: $sessionId) {
    id
    userUid
    activityId
    phaseNumber
    variantId
    contentVersion
    publicPayload
    answerKey
    status
    expiresAt
    submittedAt
    createdAt
  }
}

query GetAuthoritativeActivityResult($sessionId: UUID!)
  @auth(level: NO_ACCESS) {
  activityAttempts(
    where: { activitySessionId: { eq: $sessionId } }
    limit: 1
  ) {
    id
    activityId
    phaseNumber
    score
    correctAnswers
    wrongAnswers
    passed
    firstCompletion
    rewardBase
    streakMultiplierPercent
    streakBonus
    rewardAmount
    rewardLimitReached
    rewardSuppressionReason
    createdAt
    user {
      capiCoins
      currentStreak
    }
  }
}

# Histórico paginado de tentativas do aluno. Será usado nas atividades e,
# futuramente, nos relatórios pedagógicos.
query ListMyActivityAttempts($phaseNumber: Int!, $offset: Int = 0)
  @auth(level: USER_EMAIL_VERIFIED) {
  activityAttempts(
    where: {
      userUid: { eq_expr: "auth.uid" }
      phaseNumber: { eq: $phaseNumber }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 50
    offset: $offset
  ) {
    id
    activityId
    phaseNumber
    score
    correctAnswers
    wrongAnswers
    passed
    firstCompletion
    rewardBase
    streakMultiplierPercent
    streakBonus
    rewardAmount
    rewardLimitReached
    rewardSuppressionReason
    createdAt
  }
}

# A configuração pode ser consultada pelo app, mas somente uma rotina
# administrativa confiável consegue alterá-la.
query GetEconomyConfig @auth(level: USER_EMAIL_VERIFIED) {
  economyConfig(key: { configKey: "default" }) {
    configKey
    firstContentReward
    firstActivityReward
    repeatActivityReward
    rewardedRepeatLimitPerDay
    minimumRewardedAttemptIntervalSeconds
    streakTier3Percent
    streakTier5Percent
    streakTier7Percent
    updatedAt
  }
}

# Períodos em rascunho e encerrados não são expostos ao aluno. Um período
# SCHEDULED passa a contar automaticamente quando o relógio entra na janela;
# ACTIVE permite ativação manual e PAUSED mantém a janela sem contar pontos.
query ListVisibleCompetitionPeriods
  @auth(level: USER_EMAIL_VERIFIED) {
  competitionPeriods(
    where: {
      status: { nin: [DRAFT, CLOSED] }
      endsAt: { gt_expr: "request.time" }
    }
    orderBy: [{ startsAt: ASC }]
    limit: 5
  ) {
    id
    name
    status
    startsAt
    endsAt
    pausedAt
    closedAt
    updatedAt
  }
}

# Ranking coletivo intencionalmente visível a perfis autenticados. O SQL
# não devolve UID ou e-mail e só soma créditos positivos atribuídos ao período.
# A CTE authorized_viewer impede acesso por uma conta sem perfil no Capi Bank.
query GetCompetitionRankings(
  $periodId: UUID!
  $studentLimit: Int = 100
) @auth(level: USER_EMAIL_VERIFIED) {
  individualRanking: _select(
    sql: """
      WITH authorized_viewer AS (
        SELECT 1
        FROM users AS viewer
        WHERE
          viewer.firebase_uid = $2
          AND viewer.profile_completed = TRUE
        LIMIT 1
      ),
      target_period AS (
        SELECT period.id
        FROM competition_periods AS period
        CROSS JOIN authorized_viewer
        WHERE
          period.id = $1::uuid
          AND period.status IN ('SCHEDULED', 'ACTIVE', 'PAUSED')
          AND period.ends_at > CURRENT_TIMESTAMP
      ),
      student_totals AS (
        SELECT
          student.preferred_name,
          student.class_group,
          student.avatar_id,
          student.avatar_url,
          COALESCE(SUM(transactions.amount) FILTER (
            WHERE transactions.amount > 0
          ), 0)::integer AS total_points
        FROM users AS student
        CROSS JOIN target_period AS period
        LEFT JOIN capi_coin_transactions AS transactions
          ON transactions.user_uid = student.firebase_uid
          AND transactions.competition_period_id = period.id
        WHERE
          student.role = 'STUDENT'
          AND student.profile_completed = TRUE
          AND student.class_group IN ('THIRD_DSA', 'THIRD_DSB')
        GROUP BY
          student.firebase_uid,
          student.preferred_name,
          student.class_group,
          student.avatar_id,
          student.avatar_url
      ),
      ranked_students AS (
        SELECT
          DENSE_RANK() OVER (ORDER BY total_points DESC)::integer
            AS position,
          preferred_name,
          class_group,
          avatar_id,
          avatar_url,
          total_points
        FROM student_totals
      )
      SELECT
        position,
        preferred_name AS "preferredName",
        class_group::text AS "classGroup",
        avatar_id::text AS "avatarId",
        avatar_url AS "avatarUrl",
        total_points AS "totalPoints"
      FROM ranked_students
      ORDER BY position ASC, preferred_name ASC
      LIMIT LEAST(GREATEST($3, 1), 100)
    """
    params: [$periodId, { _expr: "auth.uid" }, $studentLimit]
  )
  classRanking: _select(
    sql: """
      WITH authorized_viewer AS (
        SELECT 1
        FROM users AS viewer
        WHERE
          viewer.firebase_uid = $2
          AND viewer.profile_completed = TRUE
        LIMIT 1
      ),
      target_period AS (
        SELECT period.id
        FROM competition_periods AS period
        CROSS JOIN authorized_viewer
        WHERE
          period.id = $1::uuid
          AND period.status IN ('SCHEDULED', 'ACTIVE', 'PAUSED')
          AND period.ends_at > CURRENT_TIMESTAMP
      ),
      student_totals AS (
        SELECT
          student.firebase_uid,
          student.class_group,
          COALESCE(SUM(transactions.amount) FILTER (
            WHERE transactions.amount > 0
          ), 0)::integer AS total_points
        FROM users AS student
        CROSS JOIN target_period AS period
        LEFT JOIN capi_coin_transactions AS transactions
          ON transactions.user_uid = student.firebase_uid
          AND transactions.competition_period_id = period.id
        WHERE
          student.role = 'STUDENT'
          AND student.profile_completed = TRUE
          AND student.class_group IN ('THIRD_DSA', 'THIRD_DSB')
        GROUP BY student.firebase_uid, student.class_group
      ),
      class_totals AS (
        SELECT
          class_group,
          COUNT(*)::integer AS registered_students,
          COUNT(*) FILTER (WHERE total_points > 0)::integer
            AS participating_students,
          COALESCE(SUM(total_points), 0)::integer AS total_points
        FROM student_totals
        GROUP BY class_group
      ),
      ranked_classes AS (
        SELECT
          DENSE_RANK() OVER (ORDER BY total_points DESC)::integer
            AS position,
          class_group,
          registered_students,
          participating_students,
          total_points
        FROM class_totals
      )
      SELECT
        position,
        class_group::text AS "classGroup",
        registered_students AS "registeredStudents",
        participating_students AS "participatingStudents",
        total_points AS "totalPoints"
      FROM ranked_classes
      ORDER BY position ASC, class_group ASC
    """
    params: [$periodId, { _expr: "auth.uid" }]
  )
}

# Consulta operacional exclusiva do backend administrativo. Ela identifica
# rajadas de aprovações por aluno/hora sem impor teto diário de recompensas.
query GetCompetitionAbuseSignals(
  $periodId: UUID!
  $minimumApprovedAttempts: Int = 20
) @auth(level: NO_ACCESS) {
  signals: _select(
    sql: """
      SELECT
        attempts.user_uid,
        DATE_TRUNC('hour', attempts.created_at) AS hour_bucket,
        COUNT(*)::integer AS approved_attempts,
        COALESCE(SUM(attempts.reward_amount), 0)::integer AS reward_amount
      FROM activity_attempts AS attempts
      INNER JOIN capi_coin_transactions AS transactions
        ON transactions.attempt_id = attempts.id
      WHERE
        transactions.competition_period_id = $1
        AND attempts.passed = TRUE
      GROUP BY
        attempts.user_uid,
        DATE_TRUNC('hour', attempts.created_at)
      HAVING COUNT(*) >= $2
      ORDER BY approved_attempts DESC, hour_bucket DESC
    """
    params: [$periodId, $minimumApprovedAttempts]
  )
}
