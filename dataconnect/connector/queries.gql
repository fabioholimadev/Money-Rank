  activityAttempts(
    where: { activitySessionId: { eq: $sessionId } }
    limit: 1
  ) {
    id
    activityId
    phaseNumber
    score
    correctAnswers
    wrongAnswers
    passed
    firstCompletion
    rewardBase
    streakMultiplierPercent
