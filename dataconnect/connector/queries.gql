# O uid não é recebido do cliente: o filtro sempre usa auth.uid.
query ListMyProgress @auth(level: USER_EMAIL_VERIFIED) {
  studentProgressEntries(
    where: { userUid: { eq_expr: "auth.uid" } }
    orderBy: [{ phaseNumber: ASC }]
  ) {
    phaseNumber
    status
    score
    attempts
    correctAnswers
    wrongAnswers
    startedAt
    completedAt
    updatedAt
  }
}

# Histórico paginado, ordenado do lançamento mais recente para o mais antigo.
query ListMyCapiCoinTransactions($offset: Int = 0)
  @auth(level: USER_EMAIL_VERIFIED) {
  capiCoinTransactions(
    where: { userUid: { eq_expr: "auth.uid" } }
    orderBy: [{ createdAt: DESC }]
    limit: 50
    offset: $offset
  ) {
    id
    attemptId
    amount
    baseAmount
    streakMultiplierPercent
    streakBonus
    transactionType
    reason
    sourceId
    phaseNumber
    classGroup
    competitionPeriodId
    competitionWeek
    createdAt
  }
}

# Retorna o lançamento de uma etapa única, como o Passo 0 ou o conteúdo de
# uma fase. Assim, o frontend exibe o valor real já multiplicado pelo streak.
query GetMyCapiCoinTransactionBySource($sourceId: String!)
  @auth(level: USER_EMAIL_VERIFIED) {
  capiCoinTransactions(
    where: {
      userUid: { eq_expr: "auth.uid" }
      sourceId: { eq: $sourceId }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 1
  ) {
    id
    amount
    baseAmount
    streakMultiplierPercent
    streakBonus
    transactionType
    sourceId
    phaseNumber
    competitionPeriodId
    createdAt
  }
}

# Recupera o resultado autoritativo de uma tentativa pelo identificador de
# idempotência. O filtro por auth.uid impede a leitura de tentativas de outro
# aluno, mesmo que o UUID seja conhecido.
query GetMyActivityAttempt($attemptId: UUID!)
  @auth(level: USER_EMAIL_VERIFIED) {
  activityAttempts(
    where: {
      id: { eq: $attemptId }
      userUid: { eq_expr: "auth.uid" }
    }
    limit: 1
  ) {
    id
    activityId
    phaseNumber
    score
    correctAnswers
    wrongAnswers
    passed
    firstCompletion
    rewardBase
    streakMultiplierPercent
    streakBonus
    rewardAmount
    rewardLimitReached
    rewardSuppressionReason
    createdAt
  }
}

# As duas consultas abaixo contêm gabarito e resultados coletivos da operação
