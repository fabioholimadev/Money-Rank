# Retorna apenas o perfil associado ao token Firebase Auth atual.
query GetMyProfile @auth(level: USER_EMAIL_VERIFIED) {
  user(key: { uid_expr: "auth.uid" }) {
    uid
    email
    preferredName
    classGroup
    role
    avatarId
    avatarUrl
    profileCompleted
    capiCoins
    currentPhase
    currentStreak
    lastStreakDate
    createdAt
    updatedAt
  }
}

# O uid não é recebido do cliente: o filtro sempre usa auth.uid.
query ListMyProgress @auth(level: USER_EMAIL_VERIFIED) {
  studentProgressEntries(
    where: { userUid: { eq_expr: "auth.uid" } }
    orderBy: [{ phaseNumber: ASC }]
  ) {
    phaseNumber
    status
    score
    attempts
    correctAnswers
    wrongAnswers
    startedAt
    completedAt
    updatedAt
  }
}

# Histórico paginado, ordenado do lançamento mais recente para o mais antigo.
query ListMyCapiCoinTransactions($offset: Int = 0)
  @auth(level: USER_EMAIL_VERIFIED) {
  capiCoinTransactions(
    where: { userUid: { eq_expr: "auth.uid" } }
    orderBy: [{ createdAt: DESC }]
    limit: 50
    offset: $offset
  ) {
    id
    attemptId
    amount
    baseAmount
    streakMultiplierPercent
    streakBonus
    transactionType
    reason
    sourceId
    phaseNumber
    classGroup
    competitionPeriodId
    competitionWeek
    createdAt
  }
}

# Retorna o lançamento de uma etapa única, como o Passo 0 ou o conteúdo de
# uma fase. Assim, o frontend exibe o valor real já multiplicado pelo streak.
query GetMyCapiCoinTransactionBySource($sourceId: String!)
  @auth(level: USER_EMAIL_VERIFIED) {
  capiCoinTransactions(
    where: {
      userUid: { eq_expr: "auth.uid" }
      sourceId: { eq: $sourceId }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 1
  ) {
    id
    amount
    baseAmount
    streakMultiplierPercent
    streakBonus
    transactionType
    sourceId
    phaseNumber
    competitionPeriodId
    createdAt
  }
}

# Recupera o resultado autoritativo de uma tentativa pelo identificador de
# idempotência. O filtro por auth.uid impede a leitura de tentativas de outro
# aluno, mesmo que o UUID seja conhecido.
query GetMyActivityAttempt($attemptId: UUID!)
  @auth(level: USER_EMAIL_VERIFIED) {
  activityAttempts(
    where: {
      id: { eq: $attemptId }
      userUid: { eq_expr: "auth.uid" }
    }
    limit: 1
  ) {
    id
    activityId
    phaseNumber
    score
    correctAnswers
    wrongAnswers
    passed
    firstCompletion
    rewardBase
    streakMultiplierPercent
    streakBonus
    rewardAmount
    rewardLimitReached
    rewardSuppressionReason
    createdAt
  }
}

# Histórico paginado de tentativas do aluno. Será usado nas atividades e,
# futuramente, nos relatórios pedagógicos.
query ListMyActivityAttempts($phaseNumber: Int!, $offset: Int = 0)
  @auth(level: USER_EMAIL_VERIFIED) {
  activityAttempts(
    where: {
      userUid: { eq_expr: "auth.uid" }
      phaseNumber: { eq: $phaseNumber }
    }
    orderBy: [{ createdAt: DESC }]
    limit: 50
    offset: $offset
  ) {
    id
    activityId
    phaseNumber
    score
    correctAnswers
    wrongAnswers
    passed
    firstCompletion
    rewardBase
    streakMultiplierPercent
    streakBonus
    rewardAmount
    rewardLimitReached
    rewardSuppressionReason
    createdAt
  }
}

# A configuração pode ser consultada pelo app, mas somente uma rotina
# administrativa confiável consegue alterá-la.
query GetEconomyConfig @auth(level: USER_EMAIL_VERIFIED) {
  economyConfig(key: { configKey: "default" }) {
    configKey
    firstContentReward
    firstActivityReward
    repeatActivityReward
    rewardedRepeatLimitPerDay
    minimumRewardedAttemptIntervalSeconds
    streakTier3Percent
    streakTier5Percent
    streakTier7Percent
    updatedAt
  }
}

# Períodos em rascunho e encerrados não são expostos ao aluno. Um período
# SCHEDULED passa a contar automaticamente quando o relógio entra na janela;
# ACTIVE permite ativação manual e PAUSED mantém a janela sem contar pontos.
query ListVisibleCompetitionPeriods
  @auth(level: USER_EMAIL_VERIFIED) {
  competitionPeriods(
    where: {
      status: { nin: [DRAFT, CLOSED] }
      endsAt: { gt_expr: "request.time" }
    }
    orderBy: [{ startsAt: ASC }]
    limit: 5
  ) {
    id
    name
    status
    startsAt
    endsAt
    pausedAt
    closedAt
    updatedAt
  }
}

# Consulta operacional exclusiva do backend administrativo. Ela identifica
# rajadas de aprovações por aluno/hora sem impor teto diário de recompensas.
query GetCompetitionAbuseSignals(
  $periodId: UUID!
  $minimumApprovedAttempts: Int = 20
) @auth(level: NO_ACCESS) {
  signals: _select(
    sql: """
      SELECT
        attempts.user_uid,
        DATE_TRUNC('hour', attempts.created_at) AS hour_bucket,
        COUNT(*)::integer AS approved_attempts,
        COALESCE(SUM(attempts.reward_amount), 0)::integer AS reward_amount
      FROM activity_attempts AS attempts
      INNER JOIN capi_coin_transactions AS transactions
        ON transactions.attempt_id = attempts.id
      WHERE
        transactions.competition_period_id = $1
        AND attempts.passed = TRUE
      GROUP BY
        attempts.user_uid,
        DATE_TRUNC('hour', attempts.created_at)
      HAVING COUNT(*) >= $2
      ORDER BY approved_attempts DESC, hour_bucket DESC
    """
    params: [$periodId, $minimumApprovedAttempts]
  )
}
